 técnica realizada.","C":"Deshacer una torunda de muestra para comprobar las puntas y dejar el resto abierto sobre la batea.","D":"Aplicar crema hidratante sobre los guantes estériles y reponer únicamente las gasas de la caja metálica."},"correcta":"B","explicacion":"Como cierre del procedimiento protocolario (pasos 9 y 10), una vez terminada la técnica el profesional debe retirarse los guantes, lavarse las manos y registrar la actividad realizada en la documentación correspondiente."}];

      function calculateResults() {

          gradeLabel = 'Sobresaliente';
          motivationalTitle = 'Dominio excelente del tema';
          motivationalMessage = 'Demuestras una comprensión sólida del instrumental sanitario, sus aplicaciones clínicas y los protocolos del carro de curas. Estás en un nivel óptimo.';
        } else if (scoreOut10 >= 7) {
          gradeLabel = 'Notable';
          motivationalTitle = 'Muy buen resultado';
          motivationalMessage = 'Manejas con seguridad la mayoría de los instrumentos y procedimientos. Repasar los pequeños detalles técnicos en las explicaciones te llevará a la máxima puntuación.';
        } else if (scoreOut10 >= 5) {
          gradeLabel = 'Aprobado';
          motivationalTitle = 'Superado con margen de mejora';
          motivationalMessage = 'Has alcanzado el aprobado. Te recomendamos practicar específicamente los subtemas donde hayas tenido dudas para afianzar la identificación y el uso del instrumental.';
        }

        return {
          total: total,
          answered: answered,
          correct: correct,
          incorrect: incorrect,
          percentage: percentage,
          scoreOut10: scoreOut10,
          gradeLabel: gradeLabel,
          motivationalTitle: motivationalTitle,
          motivationalMessage: motivationalMessage
        };
      }

      function startSession(countOverride) {
        const pool = getFilteredPool();
        const targetCount = typeof countOverride === 'number' ? countOverride : state.questionCount;
        const clamped = Math.max(1, Math.min(targetCount, pool.length));
        state.sessionQuestions = pool.slice(0, clamped);
        state.isRetryIncorrectMode = false;
        state.currentIndex = 0;
        state.answers = {};
        state.view = 'quiz';
        render();
      }

      function renderWelcome() {
        const pool = getFilteredPool();
        const available = pool.length;
        const countOptions = getCountOptions(available);
        const activeCount = Math.min(state.questionCount, available);
        const selectedTema = TEMAS.find(function (t) { return t.id === state.temaId; }) || TEMAS[0];

        let selectorHtml = '';
        if (state.scopeType === 'tema') {
          selectorHtml =
            '<div class="select-grid">' +
              '<div>' +
                '<label class="field-label" for="select-tema">Selecciona el tema</label>' +
                '<select id="select-tema" class="control">' +
                  TEMAS.map(function (t) {
                    const sel = t.id === state.temaId ? ' selected' : '';
                    return '<option value="' + escapeHtml(t.id) + '"' + sel + '>' + escapeHtml(t.label) + ' (' + t.count + ' preguntas)</option>';
                  }).join('') +
                '</select>' +
              '</div>' +
            '</div>';
        } else if (state.scopeType === 'subtema') {
          selectorHtml =
            '<div class="select-grid two-cols">' +
              '<div>' +
                '<label class="field-label" for="select-tema-parent">Tema</label>' +
                '<select id="select-tema-parent" class="control">' +
                  TEMAS.map(function (t) {
                    const sel = t.id === selectedTema.id ? ' selected' : '';
                    return '<option value="' + escapeHtml(t.id) + '"' + sel + '>' + escapeHtml(t.label) + ' (' + t.count + ')</option>';
                  }).join('') +
                '</select>' +
              '</div>' +
              '<div>' +
                '<label class="field-label" for="select-subtema">Subtema</label>' +
                '<select id="select-subtema" class="control">' +
                  selectedTema.subtemas.map(function (s) {
                    const sel = s.id === state.subtemaId ? ' selected' : '';
                    return '<option value="' + escapeHtml(s.id) + '"' + sel + '>' + escapeHtml(s.label) + ' (' + s.count + ' preguntas)</option>';
                  }).join('') +
                '</select>' +
              '</div>' +
            '</div>';
        }

        const countsHtml = countOptions.map(function (n) {
          const activeClass = activeCount === n ? ' active' : '';
          const label = n === available ? ('Todas (' + n + ')') : String(n);
          return '<button type="button" class="count-btn tabular' + activeClass + '" data-count="' + n + '">' + escapeHtml(label) + '</button>';
        }).join('');

        return (
          '<div class="container">' +
            '<section class="card">' +
              '<div class="divider-bottom">' +
                '<div class="eyebrow">' + ICONS.book + '<span>TCAE · Banco interactivo de evaluación · ' + TOTAL_QUESTIONS + ' preguntas</span></div>' +
                '<h1>Tema 2: Instrumental sanitario y el carro de curas</h1>' +
                '<p class="lead">Cuestionario autocorregible por competencias sobre clasificación y aplicaciones del instrumental médico-quirúrgico, especialidades, exploración clínica, equipos asistenciales, material desechable, limpieza del carro de curas y plegado de torundas en crisálida.</p>' +
                '<p class="attribution" data-testid="author-attribution">' + escapeHtml(AUTHOR_ATTRIBUTION) + '</p>' +
              '</div>' +
              '<div class="section-block">' +
                '<span class="section-label">1. Elige el bloque de contenidos</span>' +
                '<div class="scope-grid">' +
                  '<button type="button" class="scope-btn' + (state.scopeType === 'all' ? ' active' : '') + '" data-scope="all">' +
                    '<div class="scope-title">Todos los temas</div>' +
                    '<div class="scope-sub tabular">Banco completo · ' + TOTAL_QUESTIONS + ' preguntas</div>' +
                  '</button>' +
                  '<button type="button" class="scope-btn' + (state.scopeType === 'tema' ? ' active' : '') + '" data-scope="tema">' +
                    '<div class="scope-title">Por tema principal</div>' +
                    '<div class="scope-sub tabular">' + TEMAS.length + ' temas disponibles</div>' +
                  '</button>' +
                  '<button type="button" class="scope-btn' + (state.scopeType === 'subtema' ? ' active' : '') + '" data-scope="subtema">' +
                    '<div class="scope-title">Por subtema específico</div>' +
                    '<div class="scope-sub">Práctica focalizada por apartado</div>' +
                  '</button>' +
                '</div>' +
                selectorHtml +
              '</div>' +
              '<div class="section-block">' +
                '<div class="count-header">' +
                  '<span class="section-label">2. Número de preguntas de la práctica</span>' +
                  '<span class="count-meta tabular">Disponibles en esta selección: ' + available + '</span>' +
                '</div>' +
                '<div class="count-row">' + countsHtml + '</div>' +
              '</div>' +
              '<div class="actions-row">' +
                '<button type="button" id="start-quiz-btn" data-testid="start-quiz-btn" class="btn btn-primary">' +
                  ICONS.play +
                  '<span>Comenzar cuestionario (' + activeCount + ' ' + (activeCount === 1 ? 'pregunta' : 'preguntas') + ')</span>' +
                '</button>' +
                (state.scopeType !== 'all'
                  ? '<button type="button" id="reset-scope-btn" class="btn btn-ghost">' + ICONS.reset + '<span>Restablecer</span></button>'
                  : '') +
              '</div>' +
            '</section>' +
          '</div>'
        );
      }

      function renderQuiz() {
        const total = state.sessionQuestions.length;
        const q = state.sessionQuestions[state.currentIndex];
        const selected = state.answers[q.id];
        const isAnswered = Boolean(selected);
        const isCorrect = selected === q.correcta;

        let answeredCount = 0;
        let correctCount = 0;
        state.sessionQuestions.forEach(function (item) {
          if (state.answers[item.id]) {
            answeredCount += 1;
            if (state.answers[item.id] === item.correcta) correctCount += 1;
          }
        });
        const incorrectCount = answeredCount - correctCount;
        const progressPercent = total > 0 ? Math.round(((state.currentIndex + 1) / total) * 100) : 0;
        const isLast = state.currentIndex === total - 1;

        const optionsHtml = ['A', 'B', 'C', 'D'].map(function (letter) {
          const isSel = selected === letter;
          const isKey = q.correcta === letter;
          let cls = 'option-btn';
          let statusHtml = '';

          if (isAnswered) {
            if (isKey) {
              cls += ' state-correct';
              statusHtml = '<div class="option-status">' + ICONS.ok + '<span>' + (isSel ? 'Tu respuesta · Correcta' : 'Respuesta correcta') + '</span></div>';
            } else if (isSel) {
              cls += ' state-incorrect';
              statusHtml = '<div class="option-status">' + ICONS.err + '<span>Tu respuesta · Incorrecta</span></div>';
            } else {
              cls += ' state-dimmed';
            }
          }

          return (
            '<button type="button" class="' + cls + '" data-option="' + letter + '" data-testid="option-' + letter + '"' + (isAnswered ? ' disabled' : '') + '>' +
              '<span class="option-letter tabular">' + letter + '</span>' +
              '<span class="option-body">' +
                escapeHtml(q.opciones[letter]) +
                statusHtml +
              '</span>' +
            '</button>'
          );
        }).join('');

        const feedbackHtml = isAnswered
          ? '<div class="feedback-box ' + (isCorrect ? 'ok' : 'err') + '" data-testid="answer-feedback" role="status" aria-live="polite">' +
              '<div class="feedback-title">' +
                (isCorrect
                  ? ICONS.okLg + '<span>¡Respuesta correcta!</span>'
                  : ICONS.errLg + '<span>Respuesta incorrecta · La opción correcta es la ' + q.correcta + '</span>') +
              '</div>' +
              '<p class="feedback-text">' + escapeHtml(q.explicacion) + '</p>' +
            '</div>'
          : '';

        return (
          '<div class="container quiz-stack">' +
            '<header class="top-bar">' +
              '<div class="top-bar-actions">' +
                '<button type="button" id="go-home-btn" class="btn btn-secondary">' + ICONS.home + '<span>Volver al inicio</span></button>' +
                '<button type="button" id="restart-btn" class="btn btn-secondary">' + ICONS.reset + '<span>Reiniciar práctica</span></button>' +
              '</div>' +
              '<div class="stats-inline tabular">' +
                '<span>Respondidas: <strong>' + answeredCount + '/' + total + '</strong></span>' +
                '<span class="stat-ok">Aciertos: <strong>' + correctCount + '</strong></span>' +
                '<span class="stat-err">Fallos: <strong>' + incorrectCount + '</strong></span>' +
              '</div>' +
            '</header>' +
            '<div class="progress-card">' +
              '<div class="progress-meta tabular">' +
                '<strong style="color:#0f172a">Pregunta ' + (state.currentIndex + 1) + ' de ' + total + '</strong>' +
                '<span>' + progressPercent + ' % del recorrido</span>' +
              '</div>' +
              '<div class="progress-track" role="progressbar" aria-valuenow="' + (state.currentIndex + 1) + '" aria-valuemin="1" aria-valuemax="' + total + '">' +
                '<div class="progress-fill" style="width:' + progressPercent + '%"></div>' +
              '</div>' +
            '</div>' +
            '<article class="card">' +
              '<div class="breadcrumb">' +
                '<span>' + escapeHtml(q.tema) + '</span>' +
                '<span class="sep" aria-hidden="true">·</span>' +
                '<span class="sub">' + escapeHtml(q.subtema) + '</span>' +
              '</div>' +
              '<h2>' + escapeHtml(q.enunciado) + '</h2>' +
              '<div class="options-list" role="group" aria-label="Alternativas de respuesta">' + optionsHtml + '</div>' +
              feedbackHtml +
              '<div class="nav-footer">' +
                '<button type="button" id="prev-btn" data-testid="prev-question-btn" class="btn btn-secondary"' + (state.currentIndex === 0 ? ' disabled' : '') + '>' +
                  ICONS.prev + '<span>Pregunta anterior</span>' +
                '</button>' +
                '<div class="nav-right">' +
                  (answeredCount > 0 && !isLast
                    ? '<button type="button" id="early-finish-btn" class="btn btn-secondary">Finalizar práctica</button>'
                    : '') +
                  (!isLast
                    ? '<button type="button" id="next-btn" data-testid="next-question-btn" class="btn btn-primary" style="min-height:44px;padding:10px 20px;"><span>Siguiente pregunta</span>' + ICONS.next + '</button>'
                    : '<button type="button" id="finish-btn" data-testid="finish-quiz-btn" class="btn btn-primary" style="min-height:44px;padding:10px 20px;"><span>Ver resultados</span>' + ICONS.next + '</button>') +
                '</div>' +
              '</div>' +
            '</article>' +
          '</div>'
        );
      }

      function renderResults() {
        const res = calculateResults();
        const formattedScore = res.scoreOut10.toFixed(2).replace('.', ',');
        const unanswered = res.total - res.answered;
        const hasIncorrect = res.incorrect > 0;
        const scopeLabel = (state.isRetryIncorrectMode ? 'Repaso de preguntas incorrectas · ' : '') + describeScope();

        return (
          '<div class="container-narrow">' +
            '<section class="card">' +
              '<div class="divider-bottom">' +
                '<div class="eyebrow">' + ICONS.award + '<span>Resultados de la práctica · ' + escapeHtml(res.gradeLabel) + '</span></div>' +
                '<h1>' + escapeHtml(res.motivationalTitle) + '</h1>' +
                '<p style="margin:6px 0 0;font-size:14px;font-weight:500;color:#475569">' + escapeHtml(scopeLabel) + '</p>' +
                '<p class="lead" style="color:#334155">' + escapeHtml(res.motivationalMessage) + '</p>' +
              '</div>' +
              '<div class="metrics-grid">' +
                '<div class="metric-tile accent">' +
                  '<div class="metric-label">Calificación</div>' +
                  '<div class="metric-value tabular" data-testid="score-out-of-10">' + formattedScore + ' / 10</div>' +
                '</div>' +
                '<div class="metric-tile">' +
                  '<div class="metric-label">Porcentaje de acierto</div>' +
                  '<div class="metric-value tabular" data-testid="score-percentage">' + res.percentage + ' %</div>' +
                '</div>' +
                '<div class="metric-tile ok">' +
                  '<div class="metric-label">Aciertos</div>' +
                  '<div class="metric-value tabular" data-testid="score-correct">' + res.correct + '</div>' +
                '</div>' +
                '<div class="metric-tile err">' +
                  '<div class="metric-label">Errores</div>' +
                  '<div class="metric-value tabular" data-testid="score-incorrect">' + res.incorrect + '</div>' +
                '</div>' +
              '</div>' +
              '<div class="summary-line tabular">' +
                'Preguntas del cuestionario: <strong>' + res.total + '</strong> · ' +
                'Respondidas: <strong>' + res.answered + '</strong>' +
                (unanswered > 0 ? ' · Sin responder: <strong>' + unanswered + '</strong>' : '') +
              '</div>' +
              '<div class="actions-row" style="justify-content:flex-start;">' +
                (hasIncorrect
                  ? '<button type="button" id="repeat-incorrect-btn" data-testid="repeat-incorrect-btn" class="btn btn-primary" style="min-height:44px;padding:10px 20px;">' + ICONS.alert + '<span>Repetir preguntas incorrectas (' + res.incorrect + ')</span></button>'
                  : '') +
                '<button type="button" id="repeat-btn" data-testid="repeat-quiz-btn" class="btn ' + (hasIncorrect ? 'btn-secondary' : 'btn-primary') + '" style="min-height:44px;padding:10px 20px;">' + ICONS.reset + '<span>Repetir cuestionario</span></button>' +
                '<button type="button" id="other-topic-btn" data-testid="choose-topic-btn" class="btn btn-secondary">' + ICONS.book + '<span>Elegir otro tema</span></button>' +
                '<button type="button" id="results-home-btn" data-testid="results-home-btn" class="btn btn-secondary">' + ICONS.home + '<span>Volver al inicio</span></button>' +
              '</div>' +
            '</section>' +
          '</div>'
        );
      }

      function attachListeners() {
        const root = document.getElementById('app');

        if (state.view === 'welcome') {
          root.querySelectorAll('[data-scope]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              state.scopeType = btn.getAttribute('data-scope');
              const tema = TEMAS.find(function (t) { return t.id === state.temaId; }) || TEMAS[0];
              if (tema && !tema.subtemas.some(function (s) { return s.id === state.subtemaId; })) {
                state.subtemaId = tema.subtemas[0].id;
              }
              const poolLen = getFilteredPool().length;
              state.questionCount = state.scopeType === 'all' ? 15 : Math.min(state.questionCount, poolLen) || poolLen;
              if (state.questionCount > poolLen) state.questionCount = poolLen;
              render();
            });
          });

          const selTema = document.getElementById('select-tema');
          if (selTema) {
            selTema.addEventListener('change', function () {
              state.temaId = selTema.value;
              const tema = TEMAS.find(function (t) { return t.id === state.temaId; }) || TEMAS[0];
              state.subtemaId = tema.subtemas[0].id;
              state.questionCount = tema.count;
              render();
            });
          }

          const selTemaParent = document.getElementById('select-tema-parent');
          if (selTemaParent) {
            selTemaParent.addEventListener('change', function () {
              state.temaId = selTemaParent.value;
              const tema = TEMAS.find(function (t) { return t.id === state.temaId; }) || TEMAS[0];
              state.subtemaId = tema.subtemas[0].id;
              state.questionCount = tema.subtemas[0].count;
              render();
            });
          }

          const selSubtema = document.getElementById('select-subtema');
          if (selSubtema) {
            selSubtema.addEventListener('change', function () {
              state.subtemaId = selSubtema.value;
              const tema = TEMAS.find(function (t) { return t.id === state.temaId; }) || TEMAS[0];
              const sub = tema.subtemas.find(function (s) { return s.id === state.subtemaId; }) || tema.subtemas[0];
              state.questionCount = sub.count;
              render();
            });
          }

          root.querySelectorAll('[data-count]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              state.questionCount = Number(btn.getAttribute('data-count'));
              render();
            });
          });

          const startBtn = document.getElementById('start-quiz-btn');
          if (startBtn) startBtn.addEventListener('click', function () { startSession(); });

          const resetScopeBtn = document.getElementById('reset-scope-btn');
          if (resetScopeBtn) {
            resetScopeBtn.addEventListener('click', function () {
              state.scopeType = 'all';
              state.questionCount = 15;
              render();
            });
          }
        } else if (state.view === 'quiz') {
          root.querySelectorAll('[data-option]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              const q = state.sessionQuestions[state.currentIndex];
              if (!q || state.answers[q.id]) return;
              state.answers[q.id] = btn.getAttribute('data-option');
              render();
            });
          });

          const homeBtn = document.getElementById('go-home-btn');
          if (homeBtn) homeBtn.addEventListener('click', function () {
            state.isRetryIncorrectMode = false;
            state.view = 'welcome';
            render();
          });

          const restartBtn = document.getElementById('restart-btn');
          if (restartBtn) restartBtn.addEventListener('click', function () {
            state.currentIndex = 0;
            state.answers = {};
            render();
          });

          const prevBtn = document.getElementById('prev-btn');
          if (prevBtn) prevBtn.addEventListener('click', function () {
            if (state.currentIndex > 0) {
              state.currentIndex -= 1;
              render();
            }
          });

          const nextBtn = document.getElementById('next-btn');
          if (nextBtn) nextBtn.addEventListener('click', function () {
            if (state.currentIndex < state.sessionQuestions.length - 1) {
              state.currentIndex += 1;
              render();
            }
          });

          const finishBtn = document.getElementById('finish-btn');
          if (finishBtn) finishBtn.addEventListener('click', function () { state.view = 'results'; render(); });

          const earlyFinishBtn = document.getElementById('early-finish-btn');
          if (earlyFinishBtn) earlyFinishBtn.addEventListener('click', function () { state.view = 'results'; render(); });
        } else if (state.view === 'results') {
          const repeatIncorrectBtn = document.getElementById('repeat-incorrect-btn');
          if (repeatIncorrectBtn) repeatIncorrectBtn.addEventListener('click', function () {
            const incorrect = state.sessionQuestions.filter(function (q) {
              const sel = state.answers[q.id];
              return Boolean(sel) && sel !== q.correcta;
            });
            if (incorrect.length === 0) return;
            state.sessionQuestions = incorrect;
            state.isRetryIncorrectMode = true;
            state.currentIndex = 0;
            state.answers = {};
            state.view = 'quiz';
            render();
          });

          const repeatBtn = document.getElementById('repeat-btn');
          if (repeatBtn) repeatBtn.addEventListener('click', function () {
            startSession();
          });

          const otherBtn = document.getElementById('other-topic-btn');
          if (otherBtn) otherBtn.addEventListener('click', function () {
            state.isRetryIncorrectMode = false;
            state.scopeType = 'tema';
            state.view = 'welcome';
            render();
          });

          const homeBtn = document.getElementById('results-home-btn');
          if (homeBtn) homeBtn.addEventListener('click', function () {
            state.isRetryIncorrectMode = false;
            state.view = 'welcome';
            render();
          });
        }
      }

      function render() {
        const root = document.getElementById('app');
        if (state.view === 'quiz') {
          root.innerHTML = renderQuiz();
        } else if (state.view === 'results') {
          root.innerHTML = renderResults();
        } else {
          root.innerHTML = renderWelcome();
        }
        attachListeners();
      }

      let autostart = false;
      try {
        const params = new URLSearchParams(window.location.search || '');
        autostart = params.get('autostart') === '1';
      } catch (e) {
        autostart = false;
      }

      if (autostart) {
        state.scopeType = 'all';
        state.questionCount = TOTAL_QUESTIONS;
        startSession(TOTAL_QUESTIONS);
      } else {
        render();
      }
    })();
  </script>
</body>
</html>

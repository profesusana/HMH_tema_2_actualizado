nt":3},{"id":"5.4","label":"5.4. Otros equipos e instrumentos","count":6}]},{"id":"tema-6","label":"Tema 6. Material desechable","count":9,"subtemas":[{"id":"6.1","label":"6.1. Ventajas y clasificación del material desechable","count":9}]},{"id":"tema-7","label":"Tema 7. El carro de curas","count":15,"subtemas":[{"id":"7.1","label":"7.1. Características y material del carro de curas","count":7},{"id":"7.2","label":"7.2. Limpieza del carro de curas","count":4},{"id":"7.3","label":"7.3. Técnica de plegado de torundas en crisálida","count":4}]}];
      const QUESTIONS = [{"id":1,"temaId":"tema-1","tema":"Tema 1. Conocimiento e identificación del instrumental por parte del TCAE","subtemaId":"1.1","subtema":"Funciones asistenciales y organizativas","enunciado":"Durante una cura compleja en planta de hospitalización, el graduado en enfermería solicita con urgencia un instrumento para realizar hemostasia y el TCAE debe entregárselo del carro de curas. ¿Qué competencia profesional del TCAE justifica que conozca con exactitud la utilidad de cada pieza?","opciones":{"A":"Diagnosticar el grado de hemorragia tisular antes de iniciar cualquier procedimiento médico o quirúrgico.","B":"Preparar los paquetes y carros de curas y asistir adecuadamente al personal de enfermería o facultativo.","C":"Seleccionar de forma autónoma la técnica quirúrgica que resulta más apropiada para cerrar el vaso afectado.","D":"Prescribir la reposición farmacológica necesaria para completar la dotación habitual del control de enfermería."},"correcta":"B","explicacion":"Según el documento, el TCAE es responsable de preparar el carro de curas y los paquetes de instrumentos, así como de servir el instrumental al graduado en enfermería o al facultativo, por lo que debe conocer su utilidad. Diagnosticar, prescribir medicación o elegir técnicas quirúrgicas corresponden a otros perfiles profesionales."},{"id":2,"temaId":"tema-1","tema":"Tema 1. Conocimiento e identificación del instrumental por parte del TCAE","subtemaId":"1.2","subtema":"Mantenimiento y ciclo del material","enunciado":"Al finalizar una intervención quirúrgica, el equipo entrega al TCAE una bandeja con instrumental reutilizable utilizado durante el acto operatorio. ¿Qué secuencia de actuación corresponde al TCAE para preservar la vida útil y seguridad de este material?","opciones":{"A":"Sumergirlo en suero salino estéril, lubricarlo con vaselina, envolverlo en talla limpia y guardarlo en vitrina.","B":"Clasificarlo por especialidad médica, secarlo al aire ambiente, ordenarlo en cajas cerradas y trasladarlo a planta.","C":"Aclararlo con agua fría, verificar sus articulaciones, colocarlo en bandejas abiertas y remitirlo al almacén general.","D":"Recogerlo, limpiarlo, desinfectarlo, cuidarlo y almacenarlo tras su paso por la unidad de esterilización."},"correcta":"D","explicacion":"El TCAE es el responsable de la recogida, limpieza, desinfección, cuidado y correcto almacenamiento del instrumental para mantenerlo en buen estado y alargar su vida útil, además de desempeñar un papel fundamental en las centrales de esterilización."},{"id":3,"temaId":"tema-1","tema":"Tema 1. Conocimiento e identificación del instrumental por parte del TCAE","subtemaId":"1.3","subtema":"Papel en la central de esterilización","enunciado":"Un TCAE recién incorporado es destinado a la central de esterilización de un hospital general. ¿Por qué resulta determinante su formación previa en la identificación del instrumental médico-quirúrgico en esta unidad?","opciones":{"A":"Porque interviene de manera directa en el procesamiento, revisión y acondicionamiento de paquetes según cada uso.","B":"Porque realiza el mantenimiento técnico interno de las cámaras de vacío y autoclaves de vapor de alta presión.","C":"Porque decide la reorganización del parte quirúrgico diario en función de las cajas disponibles en planta.","D":"Porque valida mediante firma facultativa los controles biológicos finales previos a la distribución hospitalaria."},"correcta":"A","explicacion":"El documento destaca que el TCAE desempeña un papel fundamental en las centrales de esterilización y prepara los paquetes de instrumentos para curas e intervenciones, lo cual exige identificar correctamente cada pieza y su función."},{"id":4,"temaId":"tema-1","tema":"Tema 1. Conocimiento e identificación del instrumental por parte del TCAE","subtemaId":"1.4","subtema":"Ámbitos de utilización","enunciado":"Un alumno en prácticas afirma que el conocimiento del instrumental por parte del TCAE solo es necesario en el área de quirófanos. ¿Qué argumento corrige adecuadamente esta afirmación según los contenidos de la unidad?","opciones":{"A":"El TCAE gestiona el instrumental en consultas externas para realizar inventarios mensuales de reposición clínica.","B":"El instrumental utilizado en planta de hospitalización suele ser fungible y requiere verificación previa de caducidad.","C":"El TCAE prepara y maneja el instrumental tanto en exploraciones médicas como en curas y cirugías.","D":"El instrumental quirúrgico se revisa en las unidades de hospitalización antes de remitirlo a la central."},"correcta":"C","explicacion":"El texto señala expresamente que el TCAE debe conocer a fondo todo el instrumental utilizado en tareas médicas y de enfermería, tanto en la exploración como en las curas o en las intervenciones quirúrgicas."},{"id":5,"temaId":"tema-1","tema":"Tema 1. Conocimiento e identificación del instrumental por parte del TCAE","subtemaId":"1.5","subtema":"Aplicaciones básicas del instrumental","enunciado":"Antes de montar una mesa de curas, una enfermera pide al TCAE que seleccione piezas destinadas a \"producir hemostasia\" y \"exponer tejidos\". ¿Qué finalidad persiguen, respectivamente, ambos tipos de instrumentos?","opciones":{"A":"Seccionar estructuras tisulares densas y aproximar los bordes cutáneos mediante sutura mecánica.","B":"Detener el sangrado de vasos sanguíneos y facilitar la visualización del campo separando estructuras.","C":"Sujetar órganos huecos delicados y retirar mediante succión la sangre acumulada en el plano.","D":"Fijar los paños estériles sobre la piel y dilatar conductos profundos para explorar su interior."},"correcta":"B","explicacion":"Entre las aplicaciones del instrumental sanitario destacan cortar, producir hemostasia (detener la hemorragia cerrando la luz vascular), sujetar, exponer tejidos (mediante separadores para ver el campo operatorio) y aspirar."},{"id":6,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.0","subtema":"2.0. Características generales, materiales y partes","enunciado":"Al revisar las especificaciones técnicas de un lote nuevo de instrumental quirúrgico reutilizable, el TCAE lee que parte de las piezas están fabricadas en vitalio. ¿Qué composición corresponde a esta aleación utilizada en instrumental sanitario?","opciones":{"A":"Sesenta y cinco por ciento de cobalto, veinticinco por ciento de cromo y seis por ciento de molibdeno.","B":"Setenta por ciento de acero al carbono, veinte por ciento de níquel y diez por ciento de aluminio.","C":"Sesenta por ciento de titanio quirúrgico, treinta por ciento de cobre y diez por ciento de estaño.","D":"Cincuenta y cinco por ciento de carburo de tungsteno, treinta de hierro y quince de zinc industrial."},"correcta":"A","explicacion":"Aunque gran parte del instrumental se fabrica en acero inoxidable, también se emplean titanio, carburo de tungsteno y vitalio, compuesto por un 65 % de cobalto, un 25 % de cromo y un 6 % de molibdeno, entre otros elementos."},{"id":7,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.0","subtema":"2.0. Características generales, materiales y partes","enunciado":"Durante la limpieza manual de unas tijeras Metzenbaum, un estudiante pregunta qué elementos integran la denominada \"parte activa\" del instrumento. ¿Qué respuesta debe darle el TCAE?","opciones":{"A":"Las ramas y las hojas, que transmiten la fuerza mecánica ejercida desde el mango.","B":"La articulación o bisagra junto con la cremallera encargada de asegurar el cierre.","C":"Las hojas y los ojales, que permiten guiar con precisión el desplazamiento de la pieza.","D":"Las puntas y las hojas, que constituyen las zonas que entran en contacto con los tejidos."},"correcta":"D","explicacion":"Todo instrumental sanitario puede dividirse en tres partes: la parte activa (que incluye las puntas y las hojas, al entrar en contacto con los tejidos), la articulación (zona de unión o bisagra) y el mango (que incluye las ramas, los ojales y, en su caso, la cremallera)."},{"id":8,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.0","subtema":"2.0. Características generales, materiales y partes","enunciado":"Al comprobar el buen estado de una pinza antes de enviarla a esterilización, el TCAE verifica que la zona de unión permite abrir y cerrar suavemente y que el sistema de bloqueo engancha con firmeza. ¿Qué dos partes concretas está comprobando?","opciones":{"A":"Las puntas romas de la parte activa y el borde cortante de las hojas distales.","B":"La zona fenestrada de las mandíbulas y las estrías longitudinales de la cara externa.","C":"La articulación o bisagra y la cremallera situada en la zona del mango del instrumento.","D":"Las ramas paralelas superiores y los bordes dentados situados en el extremo anterior."},"correcta":"C","explicacion":"La articulación (o bisagra) es la zona de unión de las dos hojas que permite la apertura y el cierre, mientras que el mango incluye las ramas, los ojales y, en muchos instrumentos, la cremallera que hace que el cierre sea más seguro."},{"id":9,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.0","subtema":"2.0. Características generales, materiales y partes","enunciado":"Al organizar una bandeja de disección y corte, el TCAE observa unas tijeras en las que una de las hojas termina de forma redondeada y la otra acaba en punta afilada. ¿Cómo se clasifica este tipo de puntas?","opciones":{"A":"Puntas mixtas, al combinar una hoja de extremo romo con otra hoja terminada en punta fina.","B":"Puntas romas, al predominar la forma redondeada para evitar punciones accidentales en tejidos profundos.","C":"Puntas finas, al incorporar un extremo agudo destinado a retirar puntos de sutura en curas.","D":"Puntas fenestradas, al presentar aberturas diseñadas para sujetar estructuras blandas sin producir desgarros."},"correcta":"A","explicacion":"Las puntas de los instrumentos con hojas pueden ser romas (redondas), finas (acabadas en punta) o mixtas (cuando una de las dos hojas acaba en punta y la otra es roma)."},{"id":10,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.0","subtema":"2.0. Características generales, materiales y partes","enunciado":"Un TCAE debe agrupar todo el material recuperado de un quirófano siguiendo la clasificación funcional del instrumental médico-quirúrgico general. ¿Qué grupo de categorías empleará correctamente?","opciones":{"A":"Incisión superficial, tracción vascular, clampaje profundo, dilatación, cierre textil, sutura y drenaje.","B":"Uso manual, uso automático, material fungible, fijación costal, osteosíntesis, sutura y aspiración.","C":"Corte fino, exploración cavitaria, hemostasia eléctrica, exposición manual, campo, ligadura y punción.","D":"Corte o diéresis, disección y aprehensión, hemostasia, separadores, campo, sutura y aspiradores."},"correcta":"D","explicacion":"Según la tabla de clasificación funcional del instrumental médico-quirúrgico de uso general, los siete grandes grupos son: corte o diéresis, disección y aprehensión, hemostasia, separadores, campo, sutura y aspiradores."},{"id":11,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.1","subtema":"2.1. Instrumental de corte o diéresis","enunciado":"Un cirujano solicita al TCAE que prepare un bisturí manual convencional para una intervención en quirófano. ¿Qué elementos debe comprobar el TCAE que están disponibles y compatibles antes de iniciar el procedimiento?","opciones":{"A":"Un mango metálico entero de una sola pieza con hoja fija afilable tras cada intervención.","B":"Un mango graduado con mecanismo automático de resorte y una hoja reutilizable estéril.","C":"Un mango metálico numerado reutilizable y una hoja desechable compatible en envase individual.","D":"Un mango articulado en bisagra con doble filo intercambiable y funda protectora metálica."},"correcta":"C","explicacion":"El bisturí manual consta de dos partes: un mango de acero inoxidable (siendo los más usados el 3 y el 4) y hojas desechables de acero inoxidable o carbono en envases individuales de un solo uso, que deben corresponder al número del mango."},{"id":12,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.1","subtema":"2.1. Instrumental de corte o diéresis","enunciado":"En una consulta de atención primaria se va a realizar una pequeña incisión cutánea y se opta por un bisturí desechable en lugar de un escalpelo clásico. ¿Qué motivo práctico y técnico explica esta elección?","opciones":{"A":"Viene estéril en envase unitario con mango plástico, aportando comodidad y coste reducido.","B":"Permite intercambiar distintos calibres de hoja sobre el mismo mango tras la esterilización.","C":"Incorpora un mango metálico reutilizable de acero inoxidable que conserva el filo indefinidamente.","D":"Dispone de un mecanismo eléctrico interno que coagula pequeños capilares durante la incisión."},"correcta":"A","explicacion":"El bisturí desechable es de un solo uso, con mango plástico y hoja de acero inoxidable en envase unitario esterilizado, utilizado en consultas por su comodidad y coste reducido. El escalpelo es de una sola pieza de acero inoxidable, afilable y esterilizable, pero está en desuso."},{"id":13,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.1","subtema":"2.1. Instrumental de corte o diéresis","enunciado":"¿Por qué se sustituyó históricamente la antigua cuchilla quirúrgica de una sola pieza por el sistema actual de bisturí con hoja desechable?","opciones":{"A":"Porque su acero generaba reacciones de rechazo inmediatas al contactar con tejidos subcutáneos.","B":"Porque sus dimensiones impedían introducirlo en los contenedores estándar de la central de esterilización.","C":"Porque su afilado exigía disolventes industriales incompatibles con los protocolos sanitarios actuales.","D":"Porque perdía el filo rápidamente y se deformaba, dificultando un corte quirúrgico limpio y preciso."},"correcta":"D","explicacion":"Al principio el bisturí era una cuchilla configurada para cirugía, pero perdía el filo rápidamente y se deformaba, motivo por el cual se implantó el bisturí de hoja desechable."},{"id":14,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.1","subtema":"2.1. Instrumental de corte o diéresis","enunciado":"Durante una intervención de cirugía plástica, el cirujano utiliza un bisturí que emplea calor generado por corriente eléctrica de alta frecuencia. ¿Qué doble ventaja aporta este instrumento frente al bisturí frío convencional?","opciones":{"A":"Corta estructuras óseas duras mediante vibración mecánica y mide la presión arterial del paciente.","B":"Secciona los tejidos y coagula pequeños vasos sanguíneos, disminuyendo así la hemorragia.","C":"Emite ondas ultrasónicas frías sobre tejidos profundos evitando cualquier efecto térmico en la piel.","D":"Concentra luz láser sobre vasos profundos cerrando el campo operatorio sin contacto directo."},"correcta":"B","explicacion":"El bisturí eléctrico utiliza el calor generado por una corriente eléctrica de alta frecuencia para cortar tejidos y, a la vez, coagular la sangre cerrando los pequeños vasos sanguíneos, evitando o disminuyendo la hemorragia; se usa sobre todo en dermatología y cirugía plástica."},{"id":15,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.1","subtema":"2.1. Instrumental de corte o diéresis","enunciado":"En una cirugía laparoscópica se precisa un instrumento que corte y coagule tejidos mediante energía mecánica de alta vibración, mientras que en neurocirugía se emplea otro basado en luz concentrada sobre tejidos blandos. ¿A qué dos tipos de bisturí corresponde esta descripción?","opciones":{"A":"Bisturí eléctrico para la cirugía laparoscópica y bisturí manual número cuatro para la neurocirugía.","B":"Escalpelo de acero inoxidable para la laparoscopia y bisturí desechable plástico para la neurocirugía.","C":"Bisturí ultrasónico para la cirugía laparoscópica y bisturí láser para la intervención neuroquirúrgica.","D":"Sierra oscilante para la laparoscopia y costótomo articulado para el abordaje neuroquirúrgico."},"correcta":"C","explicacion":"El documento distingue entre el bisturí láser (corta tejidos blandos mediante luz láser en neurocirugía, cirugía ocular, vascular, etc.) y el bisturí ultrasónico (corte y coagulación mediante ultrasonidos en cirugía laparoscópica)."},{"id":16,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.1","subtema":"2.1. Instrumental de corte o diéresis","enunciado":"Sobre la mesa auxiliar del quirófano hay tres tipos de tijeras quirúrgicas: rectas, curvas y anguladas. Si el cirujano necesita realizar la diéresis de un vaso sanguíneo y posteriormente cortar los hilos de sutura, ¿qué tijeras utilizará en cada momento respectivamente?","opciones":{"A":"Primero las tijeras curvas para el vaso sanguíneo y después las anguladas para los hilos de sutura.","B":"Primero las tijeras rectas para el vaso sanguíneo y después las curvas para los hilos de sutura.","C":"Primero las tijeras rectas para el vaso sanguíneo y después las anguladas para los hilos de sutura.","D":"Primero las tijeras anguladas para el vaso sanguíneo y después las rectas para los hilos de sutura."},"correcta":"D","explicacion":"Por la forma de sus hojas, las tijeras rectas se emplean generalmente para cortar hilos, las curvas para tejidos y las anguladas para la diéresis (corte) de vasos sanguíneos."},{"id":17,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.1","subtema":"2.1. Instrumental de corte o diéresis","enunciado":"Al preparar el instrumental básico de corte, el TCAE debe distinguir entre las tijeras de Mayo y las tijeras de Metzenbaum. ¿Cuál es la diferencia práctica fundamental en su aplicación quirúrgica?","opciones":{"A":"Las de Mayo se reservan para disecciones muy finas oftálmicas y las de Metzenbaum para hilos gruesos.","B":"Las de Mayo cortan grandes grosores o cantidades de tejido y las de Metzenbaum disecciones más finas.","C":"Las de Mayo sirven para retirar puntos cutáneos superficiales y las de Metzenbaum para vendajes rígidos.","D":"Las de Mayo tienen punta abotonada protectora y las de Metzenbaum hojas cortas muy anchas."},"correcta":"B","explicacion":"Las tijeras de Mayo (grandes y de hojas anchas) se usan para cortar grandes grosores o cantidades de tejidos, mientras que las tijeras de Metzenbaum sirven para disecciones más finas o para aislar vasos o conductos."},{"id":18,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.1","subtema":"2.1. Instrumental de corte o diéresis","enunciado":"Un servicio de cirugía oftalmológica solicita reponer en sus cajas el instrumento adecuado para realizar disecciones extremadamente delicadas. ¿Qué tijeras cumplen específicamente con este requerimiento?","opciones":{"A":"Las tijeras de Iris de hoja curva y punta fina, indicadas para boca, plástica y oftalmología.","B":"Las tijeras de Lister acodadas con extremo abotonado, diseñadas para ropas y vendajes gruesos.","C":"Las tijeras de cizalla con mangos largos y hojas anchas, pensadas para capas de yeso.","D":"Las tijeras de Mayo rectas de punta roma, orientadas al corte de tejidos de gran espesor."},"correcta":"A","explicacion":"Las tijeras de Iris curva punta fina se utilizan específicamente para disecciones muy finas, como las que se realizan en cirugía de boca, cirugía plástica y cirugía oftalmológica."},{"id":19,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.1","subtema":"2.1. Instrumental de corte o diéresis","enunciado":"En la sala de urgencias, un paciente llega con ropa adherida que debe retirarse sin lesionar la piel, y otro requiere abrir un vendaje semirrígido de escayola delgado. ¿Qué par de tijeras resulta indicado en cada situación?","opciones":{"A":"Tijeras de Potts-Smith para cortar la ropa del paciente y tijeras de Iris para el vendaje semirrígido.","B":"Tijeras de Metzenbaum para la ropa del paciente y tijeras de Kelly vasculares para la escayola.","C":"Tijeras de Littauer para retirar la ropa y tijeras de Mayo curvas para seccionar el yeso rígido.","D":"Tijeras de Lister abotonadas para la ropa y tijeras de cizalla para capas delgadas de escayola."},"correcta":"D","explicacion":"Las tijeras Lister (para vendajes o ropas) son acodadas y tienen extremo abotonado para evitar lesiones en la piel; las tijeras para cortar escayola o cizalla son muy fuertes, de mangos largos y hojas cortas y anchas, para capas delgadas de vendajes rígidos o semirrígidos."},{"id":20,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.1","subtema":"2.1. Instrumental de corte o diéresis","enunciado":"Durante una intervención vascular profunda en una zona anatómica de difícil acceso, el cirujano pide unas tijeras con puntas finas y cortas provistas de mangos muy largos. ¿Qué modelos corresponden a estas características?","opciones":{"A":"Las tijeras de Mayo rectas y las tijeras de Lister acodadas con punta protectora roma.","B":"Las tijeras de Kelly y las tijeras de Potts-Smith empleadas como tijeras vasculares específicas.","C":"Las tijeras de cizalla reforzadas y las tijeras de Littauer destinadas a la retirada de puntos.","D":"Las tijeras de Metzenbaum convencionales y las tijeras de Iris curvas de uso oftalmológico."},"correcta":"B","explicacion":"Las tijeras vasculares poseen puntas finas y cortas con mangos muy largos para alcanzar lugares poco accesibles; el documento destaca concretamente las tijeras de Kelly y las de Potts-Smith."},{"id":21,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.1","subtema":"2.1. Instrumental de corte o diéresis","enunciado":"En la consulta de Traumatología, la enfermera solicita al TCAE el instrumental necesario para retirar los puntos de sutura de un paciente intervenido hace diez días. ¿Qué tijeras debe preparar y por qué razón técnica?","opciones":{"A":"Tijeras de Littauer, diseñadas para deslizar una hoja bajo el nudo sin dañar la piel.","B":"Tijeras de Potts-Smith, diseñadas con mangos largos para traccionar el hilo sin rozar la herida.","C":"Tijeras de Lister, diseñadas con punta abotonada en ángulo para cortar suturas adheridas.","D":"Tijeras de Mayo rectas, diseñadas con hojas anchas y punta roma para seccionar hilos gruesos."},"correcta":"A","explicacion":"Las tijeras de Littauer tienen como función principal la retirada de puntos de sutura, ya que están diseñadas para deslizarse debajo de la sutura sin provocar daño al paciente al cortar los hilos."},{"id":22,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.1","subtema":"2.1. Instrumental de corte o diéresis","enunciado":"Al revisar el listado de material para una cirugía torácica en la que es preciso seccionar las costillas, ¿qué instrumento específico de corte debe asegurarse el TCAE de incluir en la caja quirúrgica?","opciones":{"A":"Una legra o cureta metálica diseñada para raspar el tejido del fondo de una cavidad.","B":"Unas tijeras de Iris de punta fina destinadas a las disecciones de precisión superficial.","C":"Un costótomo, que actúa como una tenaza muy potente para cortar las estructuras costales.","D":"Un bisturí eléctrico de alta frecuencia para coagular los cartílagos del tórax abierto."},"correcta":"C","explicacion":"El costótomo (como el costótomo de Gluck) es una tenaza muy potente que se utiliza específicamente en cirugía torácica para seccionar las costillas."},{"id":23,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.1","subtema":"2.1. Instrumental de corte o diéresis","enunciado":"Para retirar un vendaje de yeso circular grueso en un paciente traumatológico sin riesgo de cortar la piel subyacente, ¿qué instrumento está especialmente indicado y cuál es su mecanismo de seguridad?","opciones":{"A":"La cizalla de vendajes, porque su punta abotonada desliza el filo sin ejercer presión sobre la piel.","B":"La sierra oscilante, porque corta materiales o tejidos duros sin lesionar los tejidos blandos cercanos.","C":"El costótomo de Gluck, porque sus mandíbulas permiten fracturar la escayola sin vibración mecánica.","D":"El bisturí eléctrico, porque calienta la capa externa del yeso mediante corriente de alta frecuencia."},"correcta":"B","explicacion":"La sierra oscilante corta materiales o tejidos duros (yesos o huesos en cirugía traumatológica) sin lesionar los tejidos blandos."},{"id":24,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.1","subtema":"2.1. Instrumental de corte o diéresis","enunciado":"Al separar el instrumental usado en la jornada de mañana para enviarlo a esterilización, el TCAE encuentra una legra o cureta. ¿En qué especialidad y para qué finalidad se emplea generalmente este instrumento de corte?","opciones":{"A":"En cirugía torácica, para seccionar las costillas mediante tracción manual con una tenaza potente.","B":"En dermatología, para extirpar lesiones cutáneas superficiales mediante calor eléctrico de alta frecuencia.","C":"En cirugía vascular, para realizar la diéresis precisa de pequeños vasos sanguíneos poco accesibles.","D":"En ginecología, para retirar tejido del fondo de una cavidad mediante raspado controlado."},"correcta":"D","explicacion":"La legra o cureta es un instrumental de corte utilizado generalmente en Ginecología para retirar tejido del fondo de una cavidad (legrado)."},{"id":25,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.2","subtema":"2.2. Instrumental de disección y aprehensión","enunciado":"Un alumno confunde las pinzas de disección con las pinzas de hemostasia al clasificar una bandeja quirúrgica. ¿Qué característica estructural permite diferenciar inmediatamente a unas pinzas de disección?","opciones":{"A":"Presentan dos ramas metálicas planas unidas por un extremo y diseñadas para permanecer abiertas.","B":"Incorporan anillas digitales y una cremallera de bloqueo para mantener fija la presión tisular.","C":"Terminan en óvalos fenestrados cóncavos para sujetar gasas estériles y órganos huecos delicados.","D":"Tienen puntas afiladas enfrentadas destinadas a fijar los paños quirúrgicos sobre la superficie cutánea."},"correcta":"A","explicacion":"Las pinzas de disección constan de dos ramas metálicas planas unidas por un extremo y están diseñadas para permanecer abiertas en reposo, a diferencia de las pinzas de aprehensión o hemostasia que tienen anillas y cremallera."},{"id":26,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.2","subtema":"2.2. Instrumental de disección y aprehensión","enunciado":"Durante la sutura de una herida, ¿por qué se considera a las pinzas de disección el complemento perfecto del portaagujas?","opciones":{"A":"Porque cortan el hilo sobrante junto al nudo y mantienen tensos los cabos de la sutura.","B":"Porque realizan la hemostasia definitiva de los capilares del borde y limpian el exudado.","C":"Porque sujetan los tejidos con estabilidad y ayudan a empujar la aguja suturadora a través de ellos.","D":"Porque dilatan los bordes profundos de la incisión y fijan los paños estériles alrededor."},"correcta":"C","explicacion":"Las pinzas de disección se utilizan para sujetar los tejidos durante la exposición, el corte o la sutura; son el complemento perfecto de los portaagujas porque sujetan los tejidos y empujan la aguja suturadora."},{"id":27,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.2","subtema":"2.2. Instrumental de disección y aprehensión","enunciado":"En una intervención pediátrica y en una cura sobre tejidos muy delicados, el equipo médico pide pinzas de disección específicas de pequeño tamaño y gran precisión. ¿Qué par de modelos del catálogo general responde a estas necesidades?","opciones":{"A":"Pinzas de Kocher con dientes para pediatría y pinzas de Foerster para tejidos muy delicados.","B":"Pinzas de Allis curvadas para pediatría y pinzas de Backhaus afiladas para tejidos delicados.","C":"Pinzas de Duval-Collin rectas para pediatría y pinzas de Pean estriadas para tejidos delicados.","D":"Pinzas de Adson sin dientes para pediatría y pinzas de Iris específicas para tejidos delicados."},"correcta":"D","explicacion":"El documento ilustra entre las pinzas de disección más utilizadas las pinzas de Adson sin dientes (indicadas para pediatría) y las pinzas de Iris (para tejidos delicados), además de las rectas con/sin dientes, acodadas y en bayoneta."},{"id":28,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.2","subtema":"2.2. Instrumental de disección y aprehensión","enunciado":"Al inspeccionar unas pinzas de disección rectas antes de su empaquetado, el TCAE observa unas estrías en la cara externa de las ramas metálicas. ¿Cuál es la función de estas estrías externas?","opciones":{"A":"Reforzar la elasticidad de la unión posterior para que ambas ramas permanezcan cerradas.","B":"Facilitar el manejo y el agarre firme por parte de los dedos del profesional durante la maniobra.","C":"Permitir la sujeción directa de gasas y torundas en el lateral durante las curas profundas.","D":"Identificar mediante marcas táctiles el calibre de las agujas de sutura compatibles con la pinza."},"correcta":"B","explicacion":"Las pinzas de disección tienen en la cara externa de sus ramas unas estrías diseñadas específicamente para facilitar su manejo y agarre, evitando que resbalen entre los dedos."},{"id":29,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.2","subtema":"2.2. Instrumental de disección y aprehensión","enunciado":"¿Qué característica estructural comparten todas las pinzas de aprehensión que las distingue de las pinzas de disección estándar y les permite mantener cogidos tejidos u órganos según su resistencia?","opciones":{"A":"Carecen de articulación central y permanecen abiertas hasta que se aplica presión digital continua.","B":"Presentan extremos cortantes triangulares para seccionar planos fasciales antes de la tracción.","C":"Poseen una cremallera en el mango que permite mantener cerrada la pinza de forma sostenida.","D":"Incorporan un cable conductor eléctrico destinado a coagular los tejidos sujetos en su extremo."},"correcta":"C","explicacion":"Las pinzas de aprehensión se utilizan para sujetar o coger tejidos y órganos según su resistencia y comparten una característica común: todas poseen cremallera."},{"id":30,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.2","subtema":"2.2. Instrumental de disección y aprehensión","enunciado":"En una cirugía abdominal se necesita sujetar suavemente un segmento de intestino con mayor firmeza que una pinza de disección, pero minimizando el daño tisular. ¿Qué pinza de aprehensión se emplea habitualmente en este caso?","opciones":{"A":"Las pinzas de Allis, cuyo extremo ensanchado y ligeramente curvado ofrece buena capacidad de sujeción.","B":"Las pinzas de Duval-Collin, cuyas puntas triangulares rectas permiten abarcar el parénquima intestinal.","C":"Las pinzas de Kocher, cuyas mandíbulas fuertes con dientes transversales estabilizan las asas digestivas.","D":"Las pinzas de Lovelace, cuyas puntas curvadas en triángulo fijan la pared muscular sin cremallera."},"correcta":"A","explicacion":"Las pinzas de Allis tienen mayor capacidad de sujeción que las de disección, resultan poco traumáticas gracias a su extremo ensanchado y ligeramente curvado, y se usan por ejemplo para sujetar el intestino."},{"id":31,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.2","subtema":"2.2. Instrumental de disección y aprehensión","enunciado":"Para sujetar tejido pulmonar durante una intervención torácica se preparan pinzas con puntas de forma triangular que minimizan el trauma. El cirujano pide primero unas con puntas rectas y luego otras con puntas curvadas. ¿Qué pinzas entregará el TCAE en ese orden?","opciones":{"A":"Primero unas pinzas de Babcock y posteriormente unas pinzas de Foerster portaalgodones.","B":"Primero unas pinzas de Lovelace y posteriormente unas pinzas de Allis de extremo ensanchado.","C":"Primero unas pinzas de Crile y posteriormente unas pinzas de mosquito o de Halsted.","D":"Primero unas pinzas de Duval-Collin y posteriormente unas pinzas de Lovelace curvadas."},"correcta":"D","explicacion":"Tanto las pinzas de Duval-Collin como las de Lovelace se usan para sujetar tejido pulmonar y tienen puntas en forma de triángulo para minimizar el trauma de tejidos delicados; las de Duval-Collin tienen las puntas rectas y las de Lovelace, curvadas."},{"id":32,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.2","subtema":"2.2. Instrumental de disección y aprehensión","enunciado":"Al comprobar una caja quirúrgica, el TCAE identifica unas pinzas de aprehensión con extremos fenestrados y cóncavos que permiten sujetar tejidos sin dañarlos, conocidas popularmente como \"pinzas de farolillo\". ¿De qué instrumento se trata?","opciones":{"A":"De las pinzas de Foerster, provistas de óvalos fenestrados alargados en su extremo activo.","B":"De las pinzas de Babcock, diseñadas para sujetar estructuras blandas mediante extremos cóncavos.","C":"De las pinzas de Allis, dotadas de extremos ensanchados curvados para sujeción de tejidos.","D":"De las pinzas de Lovelace, caracterizadas por sus puntas triangulares curvadas para parénquima."},"correcta":"B","explicacion":"Las pinzas de Babcock tienen extremos fenestrados y cóncavos que permiten sujetar tejidos sin dañarlos y reciben también el nombre de \"pinzas de farolillo\"."},{"id":33,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.2","subtema":"2.2. Instrumental de disección y aprehensión","enunciado":"En una bandeja de cirugía abdominal y de curas aparece un instrumento largo con cremallera cuyos extremos terminan en óvalos fenestrados, denominado habitualmente \"portaalgodones\". ¿Cuál es su nombre técnico correcto?","opciones":{"A":"Pinzas de Backhaus, empleadas para sujetar los paños quirúrgicos alrededor de la incisión.","B":"Pinzas de Guyon, utilizadas de manera específica para el clampaje atraumático del pedículo renal.","C":"Pinzas de Foerster, empleadas para sujetar gasas, torundas o tejidos sin lesionarlos.","D":"Pinzas de Desjardins, destinadas a la extracción de cálculos en los conductos biliares."},"correcta":"C","explicacion":"Las pinzas de Foerster, también llamadas \"portaalgodones\", pertenecen al grupo de aprehensión y se caracterizan por terminar en óvalos fenestrados."},{"id":34,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.2","subtema":"2.2. Instrumental de disección y aprehensión","enunciado":"Si un TCAE debe agrupar en un mismo compartimento de la central de esterilización las pinzas de Allis, Duval-Collin, Lovelace, Babcock y Foerster, ¿bajo qué criterio funcional único las clasificará?","opciones":{"A":"Instrumental de aprehensión, ya que todas poseen cremallera para sujetar tejidos u órganos.","B":"Instrumental de hemostasia estática, ya que todas cierran la luz de vasos de gran calibre.","C":"Instrumental de exploración básica, ya que todas sirven para valorar fístulas o cavidades.","D":"Instrumental de campo operatorio, ya que todas fijan la talla estéril a la superficie cutánea."},"correcta":"A","explicacion":"Todas las pinzas citadas (Allis, Duval-Collin, Lovelace, Babcock y Foerster) forman parte del instrumental de aprehensión dentro de la clasificación general."},{"id":35,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.3","subtema":"2.3. Instrumental de hemostasia o hemóstatos","enunciado":"Durante una intervención se produce la sección de un vaso sanguíneo y se aplica una pinza con cremallera y estrías transversales en la cara interna de las puntas. ¿Qué función cumple este diseño y cómo se denomina técnicamente este tipo de pinzas?","opciones":{"A":"Permite cortar los extremos del hilo de sutura y se denomina pinza de disección estática.","B":"Facilita la dilatación progresiva del conducto biliar y se denomina pinza de exploración móvil.","C":"Mantiene expuestos los bordes de la herida operatoria y se denomina retractor manual estriado.","D":"Mejora el agarre al tejido cerrando el vaso sin soltarse y se denomina hemostasia estática."},"correcta":"D","explicacion":"Las pinzas de hemostasia cierran la luz de los vasos sanguíneos para impedir la hemorragia; cuando incorporan cierre en cremallera se llaman pinzas de hemostasia estáticas y suelen presentar estrías transversales en la cara interna de las puntas para mejorar el agarre."},{"id":36,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.3","subtema":"2.3. Instrumental de hemostasia o hemóstatos","enunciado":"Para clampar vasos sanguíneos de muy pequeño calibre en una cura o cirugía menor, ¿qué pinzas hemostáticas debe seleccionar preferentemente el TCAE en la bandeja?","opciones":{"A":"Las pinzas de Kocher o de Pean, diseñadas específicamente para pedículos de gran volumen.","B":"Las pinzas mosquito o de Halsted, disponibles tanto en versión recta como en versión curva.","C":"Las pinzas de Duval-Collin triangulares, destinadas al tejido pulmonar extremadamente frágil.","D":"Las pinzas de Roeder o erinas, pensadas para sujetar los bordes de los paños quirúrgicos."},"correcta":"B","explicacion":"Las pinzas más usadas para clampar pequeños vasos sanguíneos son las pinzas mosquito o de Halsted, que pueden ser curvas o rectas."},{"id":37,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.3","subtema":"2.3. Instrumental de hemostasia o hemóstatos","enunciado":"Si durante una cirugía se requiere realizar hemostasia sobre vasos sanguíneos de mayor calibre que los atendidos con una pinza mosquito, ¿qué grupo de pinzas hemostáticas resulta adecuado preparar?","opciones":{"A":"Las pinzas de Kocher, Pean, Kelly y Crile, por su mayor tamaño y capacidad de clampaje.","B":"Las pinzas de Adson, Iris y en bayoneta, por su precisión en la sujeción sin cremallera.","C":"Las pinzas de Magill y las pinzas acodadas de oído, por su acceso a cavidades profundas.","D":"Las pinzas de Backhaus y las pinzas de Jones, por la fuerza de sus puntas enfrentadas."},"correcta":"A","explicacion":"Para vasos sanguíneos de mayor calibre se utilizan pinzas de hemostasia de mayor tamaño, entre las que el texto cita las de Kocher, las de Pean, las de Kelly y las de Crile."},{"id":38,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.3","subtema":"2.3. Instrumental de hemostasia o hemóstatos","enunciado":"Al describir las partes de unas pinzas de Crile en una sesión formativa, un alumno enumera: ojales, cremallera, ramas y articulación. ¿Qué parte esencial del extremo distal le falta mencionar para completar su anatomía?","opciones":{"A":"Las puntas mixtas, situadas junto al ojal para guiar el corte del tejido blando.","B":"La zona fenestrada, situada en el centro de las ramas para reducir el traumatismo.","C":"Las mandíbulas, situadas más allá de la articulación para realizar el clampaje directo del vaso.","D":"Los dientes triangulares, situados en el borde interno de los anillos para reforzar la sujeción."},"correcta":"C","explicacion":"En el diagrama de las pinzas de Crile de la página 7 (pág. 35 del libro), las cinco partes señaladas son: mandíbulas, articulación, ramas, cremallera y ojales."},{"id":39,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.3","subtema":"2.3. Instrumental de hemostasia o hemóstatos","enunciado":"Al revisar la caja metálica estéril que forma parte habitual del carro de curas, el TCAE comprueba su contenido de hemostasia. ¿Qué dos pinzas hemostáticas específicas forman parte de esta caja básica según el tema?","opciones":{"A":"Las pinzas de Kelly y las pinzas de Crile junto con un separador costal de Finochietto.","B":"Las pinzas de Allis y las pinzas de Babcock junto con un portaagujas automático de Mathieu.","C":"Las pinzas de Halsted rectas y las pinzas de Foerster junto con un miringótomo de oído.","D":"Las pinzas de Pean y las pinzas de Kocher junto con el resto del instrumental básico de cura."},"correcta":"D","explicacion":"En la tabla de dotación del carro de curas (pág. 23), la caja metálica estéril de instrumental para cura incluye: sonda acanalada, pinzas de Pean, pinzas de Kocher, estilete abotonado, mango y hojas desechables de bisturí, tijeras de Mayo, portaagujas y pinzas de disección."},{"id":40,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.3","subtema":"2.3. Instrumental de hemostasia o hemóstatos","enunciado":"En una nota de pedido del bloque quirúrgico figura \"Kelly\". Para evitar errores al preparar la caja en esterilización, ¿qué dos instrumentos diferentes del tema comparten el epónimo Kelly y en qué se distinguen?","opciones":{"A":"Un bisturí láser para cirugía ocular y un aspirador de secreciones portátil para vía aérea.","B":"Unas tijeras vasculares de mangos largos y unas pinzas de hemostasia para vasos de mayor calibre.","C":"Un separador abdominal con valva suprapúbica y una pinza de campo con puntas afiladas.","D":"Un portaagujas combinado con tijera interna y una legra ginecológica para raspado uterino."},"correcta":"B","explicacion":"En el documento aparecen tanto las tijeras vasculares de Kelly (instrumental de corte, pág. 5) como las pinzas de Kelly (instrumental de hemostasia para vasos de mayor calibre, pág. 7), por lo que el TCAE debe distinguir la función solicitada."},{"id":41,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.4","subtema":"2.4. Separadores","enunciado":"¿Qué criterio diferencia a los separadores manuales de los separadores estáticos o retractores durante una intervención quirúrgica?","opciones":{"A":"Los manuales están fabricados en plástico fungible y los estáticos se fabrican en vitalio esterilizable.","B":"Los manuales se emplean en consultas externas y los estáticos se reservan para curas en planta.","C":"Los manuales deben ser sostenidos por el ayudante y los estáticos se fijan solos mediante mecanismos.","D":"Los manuales sirven para seccionar tejidos profundos y los estáticos para producir hemostasia arterial."},"correcta":"C","explicacion":"Los separadores facilitan la exposición de tejidos con mínimo trauma; los manuales requieren la mano del ayudante (Roux, Farabeuf, Volkmann, Senn-Miller) y los estáticos o retractores se sujetan solos mediante cremallera, engranaje o tornillos."},{"id":42,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.4","subtema":"2.4. Separadores","enunciado":"Un cirujano necesita que el ayudante mantenga separados los bordes de una herida superficial durante toda la exploración sin utilizar sistemas automáticos de fijación. ¿Qué conjunto de instrumentos corresponde a esta modalidad?","opciones":{"A":"Los separadores de Roux, Farabeuf, Volkmann y Senn-Miller.","B":"Los separadores de Finochietto, Balfour, Gosset y Gelpi.","C":"Los separadores de Adson, Finochietto, Balfour y Roux.","D":"Los separadores de Gosset, Farabeuf, Gelpi y Volkmann."},"correcta":"A","explicacion":"Son separadores manuales el de Roux, el de Farabeuf, los de Volkmann y los de Senn-Miller; todos los demás mencionados (Finochietto, Balfour, Gosset, Adson y Gelpi) son separadores estáticos."},{"id":43,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.4","subtema":"2.4. Separadores","enunciado":"En una operación de cirugía torácica en la que ya se ha preparado un costótomo, ¿qué separador estático específico debe añadirse para mantener abierta la parrilla costal?","opciones":{"A":"El retractor de Gelpi, cuyos brazos curvados terminan en un único diente para planos peritoneales.","B":"El separador de Finochietto, diseñado específicamente como separador costal en cirugía torácica.","C":"El retractor de Gosset, indicado para laparotomías abdominales sin valva suprapúbica acoplada.","D":"El separador de Balfour, empleado de forma habitual en intervenciones ginecológicas y urológicas."},"correcta":"B","explicacion":"El separador de Finochietto es un separador estático costal utilizado específicamente en cirugía torácica."},{"id":44,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.4","subtema":"2.4. Separadores","enunciado":"En la central de esterilización se limpian dos separadores abdominales estáticos muy parecidos entre sí. ¿Qué detalle anatómico permite al TCAE distinguir el separador de Balfour del retractor de Gosset?","opciones":{"A":"El separador de Balfour se sujeta con la mano del ayudante y el de Gosset utiliza tornillos laterales.","B":"El separador de Balfour posee dientes múltiples en dos brazos y el de Gosset termina en un único diente.","C":"El separador de Balfour se emplea en cirugía torácica y el de Gosset en cirugía vascular periférica.","D":"El separador de Balfour incorpora una valva suprapúbica de la que carece el retractor de Gosset."},"correcta":"D","explicacion":"El Balfour es un separador abdominal usado en cirugía ginecológica y urológica; el retractor de Gosset es igual que el de Balfour pero sin valva suprapúbica, y se utiliza en laparotomías."},{"id":45,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.4","subtema":"2.4. Separadores","enunciado":"Un cirujano vascular pide un separador estático cuyos dos brazos terminen en varios dientes, y posteriormente en la misma área quirúrgica solicita otro cuyos brazos curvados acaben en un único diente. ¿Qué dos retractores son, respectivamente?","opciones":{"A":"Primero el retractor de Adson y a continuación el retractor de Gelpi.","B":"Primero el retractor de Gelpi y a continuación el retractor de Balfour.","C":"Primero el retractor de Gosset y a continuación el separador de Finochietto.","D":"Primero el separador de Balfour y a continuación el retractor de Adson."},"correcta":"A","explicacion":"El retractor de Adson (para cirugías vasculares) tiene dos brazos que finalizan en varios dientes; el retractor de Gelpi (empleado en cirugía vascular y peritoneal) tiene brazos curvados que terminan en un único diente."},{"id":46,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.4","subtema":"2.4. Separadores","enunciado":"Un compañero de prácticas encuentra en el inventario dos artículos denominados \"Adson\" y duda sobre su ubicación. ¿Qué dos instrumentos distintos comparten este nombre en el instrumental sanitario de uso general?","opciones":{"A":"Una tijera curva de punta fina y una pinza hemostática para vasos sanguíneos de gran calibre.","B":"Un portaagujas de cremallera manual y un aspirador quirúrgico conectado a la toma de vacío.","C":"Unas pinzas de disección usadas en pediatría y un separador estático para cirugía vascular.","D":"Una sonda acanalada para drenar abscesos y una pinza de campo con puntas enfrentadas."},"correcta":"C","explicacion":"El texto presenta dos instrumentos distintos con el nombre de Adson: las pinzas de disección de Adson sin dientes (para pediatría, pág. 6) y el retractor o separador estático de Adson (para cirugías vasculares, pág. 8)."},{"id":47,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.5","subtema":"2.5. Pinzas de campo","enunciado":"Al inicio de una intervención traumatológica, el TCAE prepara el instrumental necesario para aislar el campo operatorio. ¿Qué función específica cumplen las pinzas de campo y qué morfología las caracteriza?","opciones":{"A":"Sujetan los tejidos profundos mediante extremos fenestrados cóncavos para evitar su desgarro.","B":"Fijan los paños sobre la piel delimitando la zona estéril mediante puntas afiladas enfrentadas.","C":"Mantienen abierta la incisión muscular mediante un sistema automático de engranaje lateral.","D":"Clampan los vasos superficiales del borde cutáneo mediante estrías transversales internas."},"correcta":"B","explicacion":"Las pinzas de campo poseen puntas afiladas y enfrentadas que se cierran firmemente para sujetar los paños de campo sobre la piel durante la cirugía, aislando el campo operatorio y delimitando la zona estéril."},{"id":48,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.5","subtema":"2.5. Pinzas de campo","enunciado":"Al clasificar las pinzas de campo recuperadas tras una jornada quirúrgica, ¿qué cuatro modelos corresponden íntegramente a este grupo funcional?","opciones":{"A":"Pinzas de Mayo, de Mathieu, de Gillies y de Michel.","B":"Pinzas de Allis, de Babcock, de Foerster y de Lovelace.","C":"Pinzas de Kocher, de Pean, de Kelly y de Halsted.","D":"Pinzas de Backhaus, de Jones, de Roeder y de Doyen."},"correcta":"D","explicacion":"Las pinzas de campo más usadas son las pinzas de Backhaus, las pinzas cangrejo o de Jones, las pinzas erinas o de Roeder y las pinzas de Doyen."},{"id":49,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.5","subtema":"2.5. Pinzas de campo","enunciado":"En muchos quirófanos actuales, el uso de pinzas de campo metálicas reutilizables se ha visto reducido de manera notable. ¿Por qué material están siendo sustituidas en la práctica clínica habitual?","opciones":{"A":"Por grapadoras metálicas de titanio que fijan los bordes de la talla quirúrgica al plano muscular.","B":"Por pinzas de aprehensión de Foerster que sujetan las esquinas textiles sin perforar la epidermis.","C":"Por paños de campo estériles provistos de adhesivo y fabricados como material desechable.","D":"Por suturas sintéticas de polipropileno que anclan los campos textiles alrededor de la incisión."},"correcta":"C","explicacion":"Como indica el recuadro de la página 9, en la actualidad las pinzas de campo se están sustituyendo por paños de campo estériles con adhesivo y desechables."},{"id":50,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.6","subtema":"2.6. Material e instrumental de sutura","enunciado":"Un cirujano trabaja en una sutura sin ayudante y necesita un instrumento que le permita sujetar la aguja y seccionar la hebra inmediatamente sin cambiar de herramienta. ¿Qué portaagujas debe proporcionarle el TCAE?","opciones":{"A":"El portaagujas de Gillies, diseñado con hojas combinadas para operar sin ayudante.","B":"El portaagujas de Mathieu, equipado con sistema automático de presión palmar continua.","C":"El portaagujas de Hegar-Mayo, provisto de cremallera clásica para los dedos corazón y pulgar.","D":"El portaagujas de Mayo recto, dotado de anillas anchas para suturas de gran calibre."},"correcta":"A","explicacion":"El portaagujas de Gillies combina portaagujas en la punta y tijeras en la parte interna de la hoja, por lo que se utiliza específicamente cuando no hay ayudante."},{"id":51,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.6","subtema":"2.6. Material e instrumental de sutura","enunciado":"Al comparar el portaagujas de Mathieu con el portaagujas de Mayo (o Hegar-Mayo), ¿qué inconvenientes presenta el modelo de Mathieu frente al de cremallera clásica?","opciones":{"A":"Obliga a introducir los dedos en anillas estrechas y exige disponer de un segundo ayudante.","B":"Resulta más caro, produce mayor traumatismo en su manejo y suele estropearse con mayor rapidez.","C":"Carece de mecanismo de bloqueo por presión y admite agujas rectas que están en desuso.","D":"Impide realizar nudos quirúrgicos y requiere utilizar de forma simultánea pinzas de Michel."},"correcta":"B","explicacion":"El portaagujas automático de Mathieu se maneja apretando con la palma de la mano (una presión abre y otra cierra) y es más fácil de usar, pero resulta más caro, más traumático y se estropea antes que el de cremallera (Hegar-Mayo)."},{"id":52,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.6","subtema":"2.6. Material e instrumental de sutura","enunciado":"Al estudiar las propiedades que debe reunir un hilo de sutura quirúrgica ideal, ¿por qué motivo se busca que el material sea lo menos hidrófilo posible?","opciones":{"A":"Porque un material muy hidrófilo pierde su coloración azulada e impide localizar los puntos al retirarlos.","B":"Porque la absorción de humedad endurece los monofilamentos y transforma su sección en triangular.","C":"Porque los hilos hidrófilos pierden la compatibilidad con el calibre europeo al esterilizarse en envase.","D":"Porque la presencia de agua retenida en la hebra favorece el desarrollo bacteriano en la herida."},"correcta":"D","explicacion":"Entre las características ideales de las suturas destaca que sean lo menos hidrófilos posible, ya que la presencia de agua favorece el desarrollo bacteriano y el riesgo de infección."},{"id":53,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.6","subtema":"2.6. Material e instrumental de sutura","enunciado":"En una intervención quirúrgica es necesario suturar primero planos profundos internos y posteriormente cerrar la piel superficial que se retirará tras la cicatrización. ¿Qué combinación de materiales según su absorción corresponde a cada plano?","opciones":{"A":"Material absorbible para los órganos internos y material no absorbible para el cierre externo.","B":"Material no absorbible de seda para los órganos internos y catgut absorbible para la piel externa.","C":"Material metálico de acero inoxidable para el tejido subcutáneo y lino absorbible para los vasos.","D":"Material sintético de polipropileno para planos profundos y ácido poliglicólico para retirar luego."},"correcta":"A","explicacion":"Los materiales absorbibles (como Catgut, Dexon, Vicryl, PDS o Maxon) son digeridos e integrados por el organismo y se usan en órganos internos y tejido subcutáneo sin necesidad de retirarlos; los no absorbibles (seda, lino, nailon, polipropileno, acero) deben retirarse tras la cicatrización."},{"id":54,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.6","subtema":"2.6. Material e instrumental de sutura","enunciado":"Un cirujano solicita una sutura sintética monofilamento que sea no absorbible, y la enfermera pide al TCAE que revise las etiquetas del almacén. ¿Qué producto de la tabla de suturas cumple exactamente ambas condiciones?","opciones":{"A":"El ácido poliglicólico (Dexon®) o el poliglactín 910 (Vicryl®).","B":"El catgut natural o la seda trenzada comercializada como Silkam®.","C":"Los derivados de polipropileno (Prolene®) o poliésteres (Mirafil®).","D":"La polidiosacrona (PDS®) o el poligliconato comercializado como Maxon®."},"correcta":"C","explicacion":"Según la tabla de materiales de sutura (pág. 10), los sintéticos monofilamento no absorbibles son Mirafil® (poliésteres), Nylon® (poliamidas) y Prolene® (polipropileno). Dexon®, Vicryl®, PDS® y Maxon® son absorbibles; la seda es natural multifilamento no absorbible y el catgut es natural absorbible."},{"id":55,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.6","subtema":"2.6. Material e instrumental de sutura","enunciado":"Al valorar las ventajas e inconvenientes de los distintos tipos de sutura, ¿qué afirmación refleja correctamente las propiedades de las suturas monofilamento y de las suturas metálicas?","opciones":{"A":"Las suturas monofilamento facilitan mucho la realización de nudos pero producen un trauma tisular muy elevado.","B":"Las suturas metálicas provocan frecuentes reacciones alérgicas graves al entrar en contacto con el acero inoxidable.","C":"Las suturas multifilamento presentan un solo hilo continuo que reduce al mínimo el traumatismo en el paso.","D":"Las suturas monofilamento son menos traumáticas aunque más difíciles de manejar, y las metálicas raramente dan alergia."},"correcta":"D","explicacion":"El texto indica que los monofilamentos son mucho menos traumáticos que los multifilamentos, aunque su manejo es más difícil; en cuanto a las suturas metálicas, son fáciles y rápidas de usar y evitan en su mayoría las alergias, pues es altamente improbable la alergia al acero inoxidable."},{"id":56,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.6","subtema":"2.6. Material e instrumental de sutura","enunciado":"Una enfermera atiende a una niña de siete años con una herida en la frente y busca dejar la menor cicatriz posible, mientras que en el quirófano contiguo se prepara una intervención de microcirugía oftálmica. ¿Qué calibres de la escala americana (USP) resultan más finos y adecuados para microcirugía frente a una sutura gruesa?","opciones":{"A":"Un calibre cuatro es más fino que un uno, y en microcirugía se emplean calibres entre uno y tres.","B":"Cuantos más ceros tiene el calibre más fino es el hilo, usándose de siete ceros a once ceros en microcirugía.","C":"Cuantos menos ceros figuran en el envase menor es el grosor, usándose calibres superiores a tres en oftálmica.","D":"El calibre dos ceros equivale a dos milímetros de diámetro y requiere lentes de aumento en suturas de piel."},"correcta":"B","explicacion":"En la nomenclatura americana (USP) o \"de los ceros\", el grosor disminuye a medida que aumenta el número de ceros: un calibre 1 es más fino que un 4, un 4/0 más fino que un 2/0, entre 5/0 y 6/0 requieren lentes de aumento y de 7/0 a 11/0 se usan en microcirugía y cirugía oftálmica."},{"id":57,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.6","subtema":"2.6. Material e instrumental de sutura","enunciado":"Al comprobar el envase exterior de una caja de suturas con nomenclatura europea figura el \"calibre 1,5\", y la enfermera pide confirmar su equivalencia física y los datos de seguridad del sobre. ¿Qué grosor corresponde a ese calibre y qué información muestra el envase?","opciones":{"A":"Equivale a quince centésimas de milímetro, e indica material, calibre, aguja y fecha de caducidad.","B":"Equivale a uno coma cinco milímetros, e indica únicamente el nombre comercial y el número de lote.","C":"Equivale a quince milímetros exactos, e indica el tipo de portaagujas y la fuerza de tracción manual.","D":"Equivale a cero coma cero quince milímetros, e indica la especialidad médica y el desinfectante compatible."},"correcta":"A","explicacion":"En la nomenclatura europea, el calibre 1 equivale a 0,1 mm y el calibre 1,5 equivale a un grosor de 0,15 mm (quince centésimas de milímetro). En el exterior del envase figuran el tipo de material, calibre de la hebra, tipo y forma de aguja y fecha de caducidad."},{"id":58,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.6","subtema":"2.6. Material e instrumental de sutura","enunciado":"¿Por qué las agujas de sutura actuales se presentan \"sin ojo\" y qué relación existe entre la forma de la aguja y el instrumento utilizado para manejarla?","opciones":{"A":"Porque el ojo permite reutilizar la hebra tras esterilizarla y las agujas rectas se sujetan con portaagujas.","B":"Porque el hilo se enhebra en quirófano antes de suturar y la aguja recta es la más utilizada.","C":"Porque llevan la hebra montada de un solo uso y las agujas curvas se manejan con portaagujas.","D":"Porque las agujas curvas se manejan con los dedos y las semicurvas precisan pinzas de Allis."},"correcta":"C","explicacion":"Actualmente se usan agujas sin ojo (de un solo uso con la hebra montada en un extremo). Las formas recta (en desuso) y semicurva suelen manejarse con los dedos, mientras que la aguja curva —la más utilizada— se maneja con el portaagujas."},{"id":59,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.6","subtema":"2.6. Material e instrumental de sutura","enunciado":"Para suturar tejidos blandos como vísceras frente a tejidos más duros como piel, aponeurosis o córnea, el equipo busca evitar desgarros innecesarios. ¿Qué sección de aguja corresponde a vísceras blandas, cuál a piel/córnea y cuál combina punta cortante con cuerpo cilíndrico?","opciones":{"A":"Triangular para vísceras blandas, cilíndrica para piel y córnea, y espatulada como modelo mixto menos traumático.","B":"Espatulada para vísceras blandas, tapercut para córnea y aponeurosis, y cilíndrica como aguja muy traumática.","C":"Triangular para vísceras blandas, tapercut para tejidos muy duros, y espatulada sin ningún borde cortante.","D":"Cilíndrica para vísceras blandas, espatulada para piel y córnea, y tapercut como diseño mixto atenuado."},"correcta":"D","explicacion":"Según la tabla de secciones de aguja (pág. 11): la cilíndrica no tiene bordes cortantes y es atraumática (solo tejidos blandos/vísceras); la espatulada es hexagonal aplanada con dos bordes cortantes (piel, aponeurosis y córnea); la triangular tiene tres bordes cortantes (tejidos muy duros, muy traumática); y la tapercut combina extremo triangular y cuerpo cilíndrico (menos traumática que la triangular)."},{"id":60,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.6","subtema":"2.6. Material e instrumental de sutura","enunciado":"En una consulta de Traumatología hay que retirar grapas metálicas de una herida quirúrgica ya cicatrizada. ¿Qué instrumento empleará el personal y sobre qué punto exacto actúa para extraer cada grapa con facilidad?","opciones":{"A":"Una grapadora recargable estéril que ejerce tracción lateral sobre ambos extremos clavados de la grapa.","B":"Un quitagrapas (pinzas de Michel o desechable) que ejerce presión sobre el punto medio de la grapa.","C":"Unas tijeras de Littauer que se deslizan por debajo de la grapa para seccionarla en dos mitades.","D":"Un portaagujas automático de Mathieu que gira la grapa hacia arriba sin comprimir su zona central."},"correcta":"B","explicacion":"El quitagrapas (como las pinzas de Michel o el quitagrapas desechable) es el dispositivo que retira las grapas ejerciendo presión sobre el punto medio de la grapa para que los extremos salgan con facilidad."},{"id":61,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.7","subtema":"2.7. Aspiradores","enunciado":"Durante una intervención quirúrgica se acumula sangre y serosidad que impide la correcta visibilidad del plano operatorio. ¿Qué función cumplen los aspiradores y dónde suelen conectarse en quirófanos o habitaciones hospitalarias?","opciones":{"A":"Mantienen el campo limpio de sangre y serosidad conectándose a las tomas de vacío de la unidad.","B":"Irrigan suero fisiológico a presión continua conectándose directamente a las bombas de perfusión.","C":"Insuflan aire estéril para separar las vísceras conectándose a los reguladores de oxigenoterapia.","D":"Coagulan los capilares sangrantes conectándose a la salida eléctrica de alta frecuencia del equipo."},"correcta":"A","explicacion":"Los aspiradores sirven para mantener el campo operatorio sin sangre y serosidad, y en quirófanos o habitaciones hospitalarias suelen conectarse a las tomas de vacío existentes."},{"id":62,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.7","subtema":"2.7. Aspiradores","enunciado":"Al clasificar el instrumental tras una cirugía abdominal, el TCAE encuentra una cánula metálica curva destinada a aspirar fluidos del campo operatorio. ¿Qué dos modelos específicos de aspiradores se recogen en el instrumental general del tema?","opciones":{"A":"El aspirador de Sims y el aspirador de Wertheim-Cullen.","B":"El aspirador de Finochietto y el aspirador de Hill-Ferguson.","C":"El aspirador de Frazier y el aspirador de Yankauer.","D":"El aspirador de Desjardins y el aspirador de Bakes."},"correcta":"C","explicacion":"El apartado 2.7 cita expresamente como ejemplos habituales los aspiradores de Frazier y de Yankauer."},{"id":63,"temaId":"tema-2","tema":"Tema 2. Instrumental sanitario de uso general","subtemaId":"2.7","subtema":"2.7. Aspiradores","enunciado":"En el caso práctico de la unidad, Manuela debe separar el material usado en quirófano en siete grupos funcionales e identificar el aspirador de Yankauer junto con pinzas de Foerster y tijeras de Mayo. ¿En qué grupo encuadrará cada uno de estos tres elementos?","opciones":{"A":"Yankauer en hemostasia, Foerster en campo operatorio y tijeras de Mayo en sutura mecánica.","B":"Yankauer en separadores, Foerster en exploración y tijeras de Mayo en hemostasia estática.","C":"Yankauer en instrumental de sutura, Foerster en corte y tijeras de Mayo en disección fina.","D":"Yankauer en aspiradores, Foerster en aprehensión y tijeras de Mayo en corte o diéresis."},"correcta":"D","explicacion":"Siguiendo la clasificación funcional de la unidad, el aspirador de Yankauer pertenece al grupo de aspiradores; las pinzas de Foerster, al de disección y aprehensión; y las tijeras de Mayo, al de corte o diéresis."},{"id":64,"temaId":"tema-3","tema":"Tema 3. Instrumental sanitario por especialidades","subtemaId":"3.1","subtema":"3.1. Instrumental de cirugía traumatológica","enunciado":"Al inicio del turno, la enfermera instrumentista pide al TCAE que prepare la caja específica de cirugía traumatológica para la primera intervención del día. ¿Para qué acciones principales está diseñado este conjunto específico de instrumentos?","opciones":{"A":"Dilatar cavidades uterinas, realizar legrados endometriales y medir la longitud del útero.","B":"Cortar el hueso, colocar el material de osteosíntesis y limpiar los focos de fractura.","C":"Explorar los conductos biliares, extraer cálculos císticos y retraer la zona rectal.","D":"Visualizar las fosas nasales a través de las coanas y perforar el tímpano en otología."},"correcta":"B","explicacion":"El instrumental de cirugía traumatológica consta de piezas destinadas a cortar el hueso, colocar material de osteosíntesis y limpiar los focos de fractura."},{"id":65,"temaId":"tema-3","tema":"Tema 3. Instrumental sanitario por especialidades","subtemaId":"3.1","subtema":"3.1. Instrumental de cirugía traumatológica","enunciado":"Al revisar que no falte ningún instrumento básico en la mesa de una intervención traumatológica ósea, ¿qué listado corresponde íntegramente a piezas propias de esta especialidad?","opciones":{"A":"Espéculos vaginales, histerómetros de Sims, valvas ginecológicas y cucharillas uterinas.","B":"Pinzas de Desjardins, dilatadores de Bakes, pinzas de Guyon y retractor de Hill-Ferguson.","C":"Gubias, martillos, escoplos, periostótomos, cizallas, taladros y gatillos para hueso.","D":"Miringótomos, diapasones, rinoscopios, pinzas de Magill y asas de amigdalectomía."},"correcta":"C","explicacion":"Los instrumentos más utilizados en cirugía traumatológica son: sierras manuales y eléctricas, gubias, martillos y escoplos, periostótomos, cizallas, pinzas y gatillos para hueso y taladros."},{"id":66,"temaId":"tema-3","tema":"Tema 3. Instrumental sanitario por especialidades","subtemaId":"3.1","subtema":"3.1. Instrumental de cirugía traumatológica","enunciado":"Para la cirugía traumatológica del reto inicial del tema, además del material específico para hueso, ¿qué debe recordar preparar siempre el TCAE antes de comenzar la operación?","opciones":{"A":"El instrumental de uso general y el material de pinzas o paños para aislar el campo operatorio.","B":"El equipo de laparoscopia abdominal y los clamps atraumáticos para vasos biliares profundos.","C":"Las valvas vaginales de separación y los dilatadores progresivos para el canal pélvico.","D":"Los retractores costales de Finochietto y el material específico para biopsias ginecológicas."},"correcta":"A","explicacion":"El texto indica expresamente que en cada especialidad de medicina y cirugía se utiliza un instrumental de uso general (incluidas pinzas de campo o paños adhesivos para aislar el campo operatorio) además del instrumental específico de cada tipo de intervención."},{"id":67,"temaId":"tema-3","tema":"Tema 3. Instrumental sanitario por especialidades","subtemaId":"3.1","subtema":"3.1. Instrumental de cirugía traumatológica","enunciado":"Entre el instrumental devuelto por Traumatología para su limpieza y esterilización aparecen un martillo quirúrgico, escoplos y una gubia con extremo acanalado cortante. ¿Qué papel desempeñan estas piezas en la intervención?","opciones":{"A":"Permiten realizar la palpación abdominal profunda y controlar la perfusión endovenosa continua.","B":"Permiten desbridar abscesos cutáneos en la consulta y retirar grapas metálicas tras el alta.","C":"Permiten suturar tendones delicados con hilos multifilamento de calibre siete ceros o superior.","D":"Permiten tallar, regularizar o resecar fragmentos óseos y limpiar el foco de la fractura."},"correcta":"D","explicacion":"Los martillos, escoplos y gubias forman parte del instrumental de cirugía traumatológica destinado a trabajar sobre el hueso (cortar, regularizar o limpiar los focos de fractura)."},{"id":68,"temaId":"tema-3","tema":"Tema 3. Instrumental sanitario por especialidades","subtemaId":"3.1","subtema":"3.1. Instrumental de cirugía traumatológica","enunciado":"Durante la preparación de un procedimiento de osteosíntesis, el TCAE detecta una anomalía en el acoplamiento mecánico de las sierras eléctricas y taladros traumatológicos. ¿Qué actuación protocolaria le corresponde?","opciones":{"A":"Sustituir la pieza averiada por otra de otra caja quirúrgica sin registrar la incidencia.","B":"Comunicar la anomalía al enfermero supervisor para gestionar el mantenimiento técnico oportuno.","C":"Enviar directamente el equipo al servicio de suministros generales solicitando una unidad nueva.","D":"Guardar el aparato en el almacén limpio etiquetado para revisarlo al finalizar la jornada laboral."},"correcta":"B","explicacion":"De acuerdo con las funciones generales del TCAE en los servicios médicos y quirúrgicos, cuando detecta cualquier anomalía en los aparatos o equipos debe comunicarlo al enfermero supervisor para que se realice el mantenimiento oportuno."},{"id":69,"temaId":"tema-3","tema":"Tema 3. Instrumental sanitario por especialidades","subtemaId":"3.2","subtema":"3.2. Instrumental de ginecología","enunciado":"Al clasificar una bandeja ginecológica, el TCAE identifica unas pinzas largas de útero cuyas ramas terminan en unos extremos con forma de corazón. ¿Qué nombre específico recibe este instrumento?","opciones":{"A":"Pinzas de Wertheim-Cullen, empleadas para el clampaje en intervenciones renales.","B":"Histerómetro de Sims, destinado a determinar con precisión la profundidad uterina.","C":"Histerolabos, utilizados para sujetar y traccionar el útero durante los procedimientos.","D":"Valvas ginecológicas, diseñadas para mantener separadas las paredes de la cavidad."},"correcta":"C","explicacion":"Las pinzas de útero o histerolabos son un instrumento característico de ginecología que se distingue porque los extremos de sus ramas tienen forma de corazón."},{"id":70,"temaId":"tema-3","tema":"Tema 3. Instrumental sanitario por especialidades","subtemaId":"3.2","subtema":"3.2. Instrumental de ginecología","enunciado":"En una exploración ginecológica previa a un procedimiento intrauterino, el facultativo solicita un instrumento graduado para conocer la longitud de la cavidad del útero. ¿Qué pieza debe facilitarle el TCAE?","opciones":{"A":"El histerómetro de Sims, diseñado específicamente para realizar la medición del útero.","B":"El espéculo vaginal, destinado a dilatar el canal para visualizar el cuello uterino.","C":"La legra uterina, empleada para raspar y extraer el revestimiento del fondo cavitario.","D":"El dilatador uterino, utilizado para ensanchar de forma progresiva el orificio cervical."},"correcta":"A","explicacion":"El histerómetro de Sims es un instrumento específico de ginecología que sirve para medir el útero."},{"id":71,"temaId":"tema-3","tema":"Tema 3. Instrumental sanitario por especialidades","subtemaId":"3.2","subtema":"3.2. Instrumental de ginecología","enunciado":"Una paciente va a ser sometida a un legrado uterino en el quirófano de Ginecología. ¿Qué instrumento principal empleará el especialista para realizar el raspado de la cavidad?","opciones":{"A":"Las pinzas de cuello de útero combinadas con un espéculo nasal de tamaño adulto.","B":"Los dilatadores ginecológicos acoplados a un monitor cardiotocográfico fetal externo.","C":"Las valvas vaginales conectadas a una bomba de perfusión continua de ritmo regulable.","D":"Las legras o cucharillas uterinas diseñadas para retirar tejido del fondo cavitario."},"correcta":"D","explicacion":"En ginecología se utilizan las legras o cucharillas para efectuar el raspado (legrado) uterino y retirar tejido del fondo de la cavidad."},{"id":72,"temaId":"tema-3","tema":"Tema 3. Instrumental sanitario por especialidades","subtemaId":"3.2","subtema":"3.2. Instrumental de ginecología","enunciado":"Además de los histerolabos, el histerómetro y las legras, ¿qué otros instrumentos específicos forman parte de la dotación habitual de Ginecología descrita en la unidad?","opciones":{"A":"Costótomos de Gluck, sierras oscilantes y periostótomos para osteosíntesis pélvica.","B":"Espéculos vaginales, valvas separadoras, pinzas de cuello, pinzas de biopsia y dilatadores.","C":"Pinzas de Desjardins, sondas de cálculo biliar y retractores rectales de Hill-Ferguson.","D":"Otoscopios digitales, espejos frontales, diapasones y pinzas de amígdala curvadas."},"correcta":"B","explicacion":"El apartado 3.2 enumera como instrumental específico de ginecología: espéculos vaginales, legras o cucharillas, valvas y otros separadores, pinzas de cuello de útero y pinzas para biopsia, histerolabos, histerómetro de Sims y dilatadores."},{"id":73,"temaId":"tema-3","tema":"Tema 3. Instrumental sanitario por especialidades","subtemaId":"3.2","subtema":"3.2. Instrumental de ginecología","enunciado":"En una intervención quirúrgica ginecológica abierta por vía abdominal se prepara, además de las valvas específicas, un separador estático de uso general muy frecuente en esta especialidad y en urología. ¿De qué separador se trata?","opciones":{"A":"El separador de Balfour, que cuenta con valva suprapúbica para la exposición abdominal.","B":"El retractor de Gosset, diseñado como marco autoestático sin valva suprapúbica adicional.","C":"El retractor de Gelpi, utilizado para exponer incisiones pélvicas mediante diente único curvo.","D":"El retractor de Adson, provisto de dos brazos articulados que finalizan en varios dientes."},"correcta":"A","explicacion":"En la página 8 se especifica que el separador de Balfour es un separador abdominal estático utilizado habitualmente en cirugía ginecológica y urológica."},{"id":74,"temaId":"tema-3","tema":"Tema 3. Instrumental sanitario por especialidades","subtemaId":"3.3","subtema":"3.3. Instrumental de cirugía abdominal","enunciado":"En cirugía abdominal actual, procedimientos como la apendicectomía o la extirpación de la vesícula biliar se realizan con gran frecuencia de forma mínimamente invasiva. ¿Qué instrumento principal permite esta técnica tanto con fines exploratorios como terapéuticos?","opciones":{"A":"El retractor de Gosset combinado con un bisturí manual de mango número cuatro.","B":"El ecógrafo abdominal acoplado a una sonda acanalada para el drenaje vesicular.","C":"El endoscopio para laparoscopia introducido para visualizar e intervenir en la cavidad.","D":"El litotriptor extracorpóreo destinado a fragmentar cálculos mediante ondas externas."},"correcta":"C","explicacion":"En cirugía abdominal se realizan multitud de intervenciones con fines exploratorios y terapéuticos mediante el endoscopio para laparoscopia, como la extirpación de vesícula biliar y la apendicectomía."},{"id":75,"temaId":"tema-3","tema":"Tema 3. Instrumental sanitario por especialidades","subtemaId":"3.3","subtema":"3.3. Instrumental de cirugía abdominal","enunciado":"Un cirujano general interviene sobre los conductos biliares y la vesícula biliar para localizar cálculos y dilatar el conducto. ¿Qué instrumentos específicos de esta subárea debe contener la caja quirúrgica?","opciones":{"A":"Pinzas de Guyon atraumáticas y pinzas-clamp de Wertheim-Cullen.","B":"Cucharilla de cálculo biliar, pinzas y sonda de Desjardins y dilatador de Bakes.","C":"Clamps intestinales largos y retractor de recto curvo de Hill-Ferguson.","D":"Histerómetro de Sims graduado, valvas ginecológicas y pinzas de cuello uterino."},"correcta":"B","explicacion":"El material específico para conductos biliares y vesícula biliar incluye la cucharilla de cálculo biliar, las pinzas de conducto biliar y cístico de Desjardins, la sonda para cálculos biliares de Desjardins y el dilatador para conducto biliar de Bakes."},{"id":76,"temaId":"tema-3","tema":"Tema 3. Instrumental sanitario por especialidades","subtemaId":"3.3","subtema":"3.3. Instrumental de cirugía abdominal","enunciado":"En una nefrectomía programada dentro del bloque quirúrgico de Urología y Cirugía Abdominal, el cirujano necesita ocluir temporalmente el pedículo vascular sin lesionar los tejidos renales. ¿Qué dos instrumentos específicos pertenecen al área de cirugía renal?","opciones":{"A":"La sonda acanalada para trayectos fistulosos y el estilete abotonado metálico.","B":"El costótomo de Gluck para parrilla costal y las cizallas de hueso traumatológicas.","C":"El dilatador de Bakes de punta olivar y las pinzas de Desjardins para conductos.","D":"Las pinzas de

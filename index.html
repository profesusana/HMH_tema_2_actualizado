 Guyon de acción atraumática y las pinzas-clamp de Wertheim-Cullen."},"correcta":"D","explicacion":"En la subárea de cirugía renal dentro de la cirugía abdominal se emplean específicamente las pinzas de Guyon (diseñadas para sujetar el pedículo renal sin dañar los tejidos) y las pinzas-clamp de Wertheim-Cullen."},{"id":77,"temaId":"tema-3","tema":"Tema 3. Instrumental sanitario por especialidades","subtemaId":"3.3","subtema":"3.3. Instrumental de cirugía abdominal","enunciado":"Durante una intervención de cirugía intestinal y proctología, el cirujano solicita un instrumento específico para exponer el canal anal y la porción distal del recto. ¿Qué pieza debe facilitarle el personal instrumentista?","opciones":{"A":"El separador costal de Finochietto equipado con cremallera de apertura progresiva.","B":"El histerómetro graduado de Sims empleado en exploraciones de la cavidad uterina.","C":"El retractor de recto de Hill-Ferguson destinado a la exposición en proctología.","D":"El periostótomo traumatológico utilizado para despegar el tejido fibroso óseo."},"correcta":"C","explicacion":"El retractor de recto de Hill-Ferguson es un instrumento específico de cirugía intestinal y proctología que facilita la visualización y el acceso al canal anal y al recto."},{"id":78,"temaId":"tema-3","tema":"Tema 3. Instrumental sanitario por especialidades","subtemaId":"3.3","subtema":"3.3. Instrumental de cirugía abdominal","enunciado":"Además de los instrumentos propios de cada órgano abdominal, la enfermera instrumentista pide al TCAE que prepare el equipo básico complementario para cirugía abdominal abierta. ¿Qué elementos debe incluir ese lote?","opciones":{"A":"Instrumentos de sutura mecánica, separadores abdominales y pinzas de Foerster.","B":"Tijeras vasculares de Potts-Smith, separador costal Finochietto y pinzas de Duval-Collin.","C":"Escoplos traumatológicos, pinzas de campo Backhaus y portaagujas automáticos Mathieu.","D":"Pinzas de Adson pediátricas, legras uterinas de raspado y tijeras de vendaje Lister."},"correcta":"A","explicacion":"Como material básico complementario en cirugía abdominal abierta se incluyen instrumentos de sutura mecánica, separadores abdominales (como Balfour o Gosset) y pinzas de aprehensión como las de Foerster."},{"id":79,"temaId":"tema-4","tema":"Tema 4. Material para exploraciones médicas","subtemaId":"4.1","subtema":"4.1. Material básico de exploración","enunciado":"En la consulta de urgencias llega un paciente con una herida penetrante estrecha en el antebrazo y el médico necesita conocer su profundidad y dirección exacta antes de suturar. ¿Qué instrumento básico de exploración permite realizar esta valoración?","opciones":{"A":"Un espéculo bivalvo metálico con tornillo regulador para dilatar la piel superficial.","B":"Un estilete metálico fino, con extremo puntiagudo o abotonado, para explorar la herida.","C":"Un trócar con mandril interno destinado a la extracción de cilindros sólidos de tejido.","D":"Unas pinzas de Magill anguladas diseñadas para extraer cuerpos de la vía aérea."},"correcta":"B","explicacion":"El estilete es una varilla metálica fina que puede tener un extremo puntiagudo o abotonado (olivar) y se utiliza específicamente para explorar la profundidad y la dirección de una herida o trayecto."},{"id":80,"temaId":"tema-4","tema":"Tema 4. Material para exploraciones médicas","subtemaId":"4.1","subtema":"4.1. Material básico de exploración","enunciado":"Para evaluar el trayecto de una fístula y facilitar la evacuación o drenaje de una pequeña colección purulenta sin dañar los planos subyacentes, ¿qué instrumento de exploración básica debe seleccionar el TCAE?","opciones":{"A":"El depresor lingual desechable de madera utilizado en la exploración bucofaríngea.","B":"El diapasón metálico vibratorio empleado para valorar la conducción auditiva ósea.","C":"El martillo de reflejos triangular destinado a explorar respuestas osteotendinosas.","D":"La sonda acanalada, que permite seguir el trazado de fístulas y guiar el drenaje."},"correcta":"D","explicacion":"La sonda acanalada presenta un canal longitudinal que sirve para explorar el trazado de fístulas, evidenciar su recorrido, facilitar el drenaje de líquidos y proteger los tejidos profundos al incidir sobre ella."},{"id":81,"temaId":"tema-4","tema":"Tema 4. Material para exploraciones médicas","subtemaId":"4.1","subtema":"4.1. Material básico de exploración","enunciado":"Un facultativo va a realizar una punción diagnóstica en una cavidad corporal para evacuar líquido y obtener una muestra de biopsia tisular. ¿Qué instrumento médico consiste en un tubo metálico con estilete punzante diseñado para este fin?","opciones":{"A":"El trócar, utilizado para realizar punciones cavitarias y obtener muestras de biopsia.","B":"El estilete abotonado, empleado para sondar heridas cutáneas sin perforar tejidos.","C":"La pinza de Pean, destinada a realizar hemostasia por compresión en vasos pequeños.","D":"El laringoscopio de hoja recta, indicado para visualizar la glotis durante la intubación."},"correcta":"A","explicacion":"El trócar es un instrumento compuesto por una cánula metálica y un punzón o mandril interno que se utiliza para puncionar cavidades, evacuar colecciones líquidas o extraer muestras para biopsia."},{"id":82,"temaId":"tema-4","tema":"Tema 4. Material para exploraciones médicas","subtemaId":"4.1","subtema":"4.1. Material básico de exploración","enunciado":"Durante una intubación nasotraqueal dificultosa en urgencias, el médico necesita dirigir la punta del tubo endotraqueal hacia la laringe y, previamente, retirar un cuerpo extraño alojado en la hipofaringe. ¿Qué pinzas específicas solicita al TCAE?","opciones":{"A":"Las pinzas de disección de Adson sin dientes empleadas en intervenciones pediátricas.","B":"Las pinzas de campo de Backhaus provistas de extremos curvos afilados enfrentados.","C":"Las pinzas de hemostasia de Halsted diseñadas para vasos capilares superficiales.","D":"Las pinzas de Magill, ideales para guiar tubos, sondas y retirar cuerpos faríngeos."},"correcta":"D","explicacion":"Las pinzas de Magill tienen una angulación característica que evita obstruir la visión del profesional; se utilizan para dirigir el tubo endotraqueal hacia la laringe, guiar sondas y extraer cuerpos extraños de la faringe."},{"id":83,"temaId":"tema-4","tema":"Tema 4. Material para exploraciones médicas","subtemaId":"4.1","subtema":"4.1. Material básico de exploración","enunciado":"Al revisar la composición de la caja metálica estéril del carro de curas en una planta quirúrgica, ¿qué dos instrumentos del grupo de material básico de exploración se encuentran habitualmente incluidos en su interior?","opciones":{"A":"El trócar de punción hepática y el portaagujas automático de presión palmar.","B":"Las pinzas de disección largas y las tijeras rectas de punta roma de Mayo.","C":"La sonda acanalada para drenajes y el estilete abotonado de exploración.","D":"El mango de bisturí del número tres y las pinzas anguladas de Magill."},"correcta":"C","explicacion":"Dentro de la caja metálica estéril del carro de curas se incluyen de forma habitual dos instrumentos del material básico de exploración: la sonda acanalada y el estilete abotonado, junto a pinzas hemostáticas, tijeras, bisturí y material de sutura."},{"id":84,"temaId":"tema-4","tema":"Tema 4. Material para exploraciones médicas","subtemaId":"4.1","subtema":"4.1. Material básico de exploración","enunciado":"Un alumno elabora una ficha resumen con los cuatro instrumentos que conforman el subgrupo de material básico de exploración estudiado en el tema. ¿Qué relación recoge íntegramente esos cuatro elementos?","opciones":{"A":"Tensiómetro manual, fonendoscopio biauricular, linterna clínica y glucómetro capilar.","B":"Estilete, sonda acanalada, trócar de punción y pinzas anguladas de Magill.","C":"Otoscopio digital, rinoscopio nasal, laringoscopio curvo y depresor lingual.","D":"Báscula con tallímetro, termómetro clínico, cinta métrica y martillo de reflejos."},"correcta":"B","explicacion":"El apartado 4.1 agrupa como material básico de exploración exactamente estos cuatro instrumentos: el estilete, la sonda acanalada, el trócar y las pinzas de Magill."},{"id":85,"temaId":"tema-4","tema":"Tema 4. Material para exploraciones médicas","subtemaId":"4.2","subtema":"4.2. Material de exploración general","enunciado":"En la consulta de Atención Primaria se realizan mediciones antropométricas consecutivas a un varón adulto que acude a revisión y a un lactante de tres meses. ¿Qué dispositivos corresponden correctamente a cada paciente según el manual?","opciones":{"A":"Para ambos pacientes se emplea la báscula vertical de pie con varilla graduada extensible.","B":"Para el adulto se utiliza un tallímetro vertical independiente y para el bebé un calibrador óptico.","C":"Para el adulto se usa báscula con tallímetro y para el bebé metro en plano horizontal y báscula pequeña.","D":"Para el adulto se utiliza báscula de plataforma y para el bebé la misma báscula con sujeción sentada."},"correcta":"C","explicacion":"Para medir y pesar a adultos y niños mayores se utiliza la báscula con tallímetro; en cambio, a los bebés se les mide la talla con un metro sobre una superficie plana (en decúbito) y se les pesa en una báscula pequeña adaptada (pesabebés)."},{"id":86,"temaId":"tema-4","tema":"Tema 4. Material para exploraciones médicas","subtemaId":"4.2","subtema":"4.2. Material de exploración general","enunciado":"Durante la toma de la tensión arterial con un esfigmomanómetro aneroide manual, el TCAE observa que la presión desciende bruscamente aunque la válvula esté cerrada, impidiendo leer la cifra sistólica. ¿En qué dos puntos es más probable localizar la fuga de aire?","opciones":{"A":"En el interior de la esfera graduada del manómetro o en el diafragma metálico acústico.","B":"En el cierre de velcro del brazalete textil o en las olivas auriculares del fonendoscopio.","C":"En la válvula antirretorno de la pera metálica o en la aguja indicadora del dial graduado.","D":"En la válvula de purga lateral o en las uniones del tubo conector de goma con el manguito."},"correcta":"D","explicacion":"Las averías por pérdida de aire en el tensiómetro manual suelen deberse a un mal cierre o desgaste en la válvula de purga (tornillo regulador) o a grietas y holguras en las uniones de los tubos conectores."},{"id":87,"temaId":"tema-4","tema":"Tema 4. Material para exploraciones médicas","subtemaId":"4.2","subtema":"4.2. Material de exploración general","enunciado":"Al preparar el equipo para medir la presión arterial a un paciente obeso y a un niño pequeño en consultas externas, ¿qué principio físico fundamenta el esfigmomanómetro y qué precaución debe adoptar el TCAE con el manguito?","opciones":{"A":"Registra la onda venosa superficial y utiliza un único manguito estándar ajustable a cualquier brazo.","B":"Comprime externamente la arteria hasta ocluirla y exige seleccionar un manguito acorde al tamaño del paciente.","C":"Mide la saturación arterial por transiluminación y precisa colocar el brazalete por debajo del codo.","D":"Detecta la presión capilar periférica y obliga a inflar la cámara neumática al máximo de su escala."},"correcta":"B","explicacion":"El esfigmomanómetro comprime externamente la arteria (generalmente la braquial) hasta ocluir el flujo sanguíneo para medir las presiones sistólica y diastólica; además, existen distintos tamaños de manguitos adaptados a la complexión del paciente (pediátricos, estándar y de obesos)."},{"id":88,"temaId":"tema-4","tema":"Tema 4. Material para exploraciones médicas","subtemaId":"4.2","subtema":"4.2. Material de exploración general","enunciado":"Una enfermera compara la utilización clínica del tensiómetro digital automático frente al tensiómetro manual tradicional en una planta hospitalaria muy ruidosa. ¿Qué valoración técnica describe con mayor fidelidad el equipo digital?","opciones":{"A":"Es menos preciso que el manual, resulta muy útil con ruido ambiental o sobrecarga y se prefieren los de brazo.","B":"Resulta más exacto que el aneroide en arritmias graves y ofrece lecturas idénticas tanto en muñeca como en brazo.","C":"Exige el uso simultáneo del fonendoscopio en la flexura del codo y solo está indicado en unidades de cuidados intensivos.","D":"Sustituye completamente al esfigmomanómetro manual en pacientes pediátricos gracias a su calibración automática permanente."},"correcta":"A","explicacion":"El documento señala que los tensiómetros digitales son menos precisos que los manuales, aunque resultan muy útiles cuando hay mucho ruido ambiental o sobrecarga asistencial, recomendándose preferentemente los modelos de brazo frente a los de muñeca."},{"id":89,"temaId":"tema-4","tema":"Tema 4. Material para exploraciones médicas","subtemaId":"4.2","subtema":"4.2. Material de exploración general","enunciado":"Al realizar la limpieza y revisión de un fonendoscopio tras la ronda médica, el TCAE comprueba el estado de las olivas, el arco metálico, la campana y otros dos componentes fundamentales del aparato. ¿Qué elementos completan la estructura básica del fonendoscopio?","opciones":{"A":"La válvula de purga lateral y la pera insufladora de caucho flexible.","B":"El mango portapilas cilíndrico y la lente de aumento intercambiable.","C":"El diafragma o membrana de la cabeza y la tubuladura flexible de goma.","D":"El sensor fotoeléctrico de pinza y la pantalla de lectura alfanumérica."},"correcta":"C","explicacion":"El fonendoscopio (o estetoscopio) consta de olivas auriculares, arco metálico, tubuladura de goma y cabeza receptora provista de campana y diafragma (o membrana)."},{"id":90,"temaId":"tema-4","tema":"Tema 4. Material para exploraciones médicas","subtemaId":"4.2","subtema":"4.2. Material de exploración general","enunciado":"Además de auscultar los latidos cardíacos y los ruidos pulmonares, ¿en qué otras dos valoraciones clínicas se utiliza el fonendoscopio tradicional y qué ventaja aporta el modelo electrónico actual?","opciones":{"A":"Se usa para auscultar ruidos intestinales y medir la tensión manual; el electrónico amplifica y detecta sonidos con gran precisión.","B":"Se usa para valorar reflejos osteotendinosos y saturación venosa; el electrónico elimina la necesidad de colocar la membrana sobre la piel.","C":"Se usa para comprobar la frecuencia respiratoria fetal y presión venosa central; el electrónico registra electrocardiogramas en papel térmico.","D":"Se usa para inspeccionar el conducto auditivo y medir glucemia acústica; el electrónico prescinde de auriculares al proyectar la voz."},"correcta":"A","explicacion":"El fonendoscopio sirve para auscultar ruidos cardíacos, respiratorios e intestinales, así como para tomar la tensión arterial manual junto al esfigmomanómetro. El fonendoscopio electrónico permite detectar y amplificar los sonidos corporales con gran precisión."},{"id":91,"temaId":"tema-4","tema":"Tema 4. Material para exploraciones médicas","subtemaId":"4.2","subtema":"4.2. Material de exploración general","enunciado":"Al revisar el bolsillo de trabajo de un estudiante de TCAE, se comprueba que su linterna clínica de exploración cumple las características requeridas. ¿Qué tipo de iluminación debe emitir y en qué dos exploraciones básicas se utiliza con mayor frecuencia?","opciones":{"A":"Luz cálida y tenue para inspeccionar fosas nasales y valorar la capacidad auditiva.","B":"Luz potente y fría para observar los reflejos pupilares y explorar la cavidad bucofaríngea.","C":"Luz halógena intermitente para visualizar el tímpano y localizar trayectos fistulosos.","D":"Luz difusa amarilla para examinar lesiones dérmicas y evaluar el reflejo plantar."},"correcta":"B","explicacion":"La linterna clínica de exploración debe proporcionar una luz potente y fría (para no calentar ni molestar las mucosas y pupilas) y se utiliza fundamentalmente para explorar la cavidad bucofaríngea y comprobar la reacción de los reflejos pupilares."},{"id":92,"temaId":"tema-4","tema":"Tema 4. Material para exploraciones médicas","subtemaId":"4.2","subtema":"4.2. Material de exploración general","enunciado":"En una planta de Medicina Interna, un paciente diabético precisa un control glucémico antes del desayuno mediante glucómetro portátil. ¿Qué principio de lectura utiliza este aparato y cómo se realiza la obtención y lectura de la muestra?","opciones":{"A":"Es un sensor magnético que lee tres gotas de sangre venosa recogidas en tubo capilar sin reactivos tras dos minutos.","B":"Es un analizador térmico que mide el nivel de glucosa a través de la sudoración palmar tras aplicar un electrodo.","C":"Es un medidor acústico que analiza una muestra de saliva depositada sobre un portaobjetos de cristal reutilizable.","D":"Es un aparato óptico que analiza una o dos gotas de sangre capilar obtenidas con lanceta sobre una tira en segundos."},"correcta":"D","explicacion":"El glucómetro es un aparato óptico de pequeño tamaño en el que se introduce una tira reactiva impregnada con una o dos gotas de sangre capilar (obtenidas pinchando el dedo con una lanceta estéril), mostrando la cifra de glucemia en pocos segundos."},{"id":93,"temaId":"tema-4","tema":"Tema 4. Material para exploraciones médicas","subtemaId":"4.2","subtema":"4.2. Material de exploración general","enunciado":"Al registrar la temperatura corporal de los pacientes ingresados, ¿en qué zonas anatómicas se colocan habitualmente los termómetros clínicos digitales y qué sistema de medición térmica se emplea en unidades de cuidados intensivos?","opciones":{"A":"Se colocan en la axila o bajo la lengua, mientras que en UCI suelen utilizarse sensores conectados al monitor.","B":"Se colocan sobre el pabellón auricular externo, mientras que en UCI se utilizan únicamente termómetros de mercurio.","C":"Se colocan en el pliegue inguinal, mientras que en UCI se registra la temperatura mediante cintas frontales adhesivas.","D":"Se colocan en la palma de la mano, mientras que en UCI la enfermera realiza mediciones orales horarias manuales."},"correcta":"A","explicacion":"Los termómetros clínicos digitales convencionales se colocan habitualmente en la axila o debajo de la lengua (también existen modelos óticos/infrarrojos); en las unidades de cuidados intensivos (UCI) se emplean sensores continuos conectados directamente al monitor del paciente."},{"id":94,"temaId":"tema-4","tema":"Tema 4. Material para exploraciones médicas","subtemaId":"4.2","subtema":"4.2. Material de exploración general","enunciado":"Para examinar adecuadamente la faringe y las amígdalas de un paciente con odinofagia, el médico pide un depresor lingual al TCAE. ¿De qué materiales puede estar fabricado este instrumento y con qué otro elemento suele acompañarse durante la técnica?","opciones":{"A":"De vidrio templado o caucho blando reutilizable, acompañándose siempre de una sonda acanalada.","B":"De aluminio flexible o silicona rígida, acompañándose habitualmente de un esfigmomanómetro.","C":"De metal, plástico o madera desechables, acompañándose de una fuente de luz como la linterna.","D":"De acero al carbono cromado, acompañándose obligatoriamente de un abrebocas quirúrgico rígido."},"correcta":"C","explicacion":"El depresor lingual puede ser de metal (reutilizable tras esterilización), plástico o madera (desechables, los más habituales en consulta) y se utiliza acompañado de una luz (linterna clínica o foco) para iluminar la cavidad bucofaríngea."},{"id":95,"temaId":"tema-4","tema":"Tema 4. Material para exploraciones médicas","subtemaId":"4.2","subtema":"4.2. Material de exploración general","enunciado":"Al revisar la bandeja de exploración general, el TCAE agrupa tres utensilios según su utilidad clínica: el abrebocas, la cinta métrica y el martillo de reflejos. ¿Qué función cumple cada uno de ellos respectivamente?","opciones":{"A":"Medir la temperatura timpánica, calibrar el diámetro pupilar y evaluar la presión sistólica.","B":"Separar las paredes nasales, cuantificar la saturación capilar y percutir los senos frontales.","C":"Visualizar la glotis durante la anestesia, comprobar el calibre de sondas y extraer tapones.","D":"Mantener abierta la boca al explorar o intubar, medir dimensiones corporales y valorar reflejos."},"correcta":"D","explicacion":"El abrebocas mantiene la boca abierta para explorar o intubar evitando mordeduras; la cinta métrica mide perímetros y dimensiones corporales (como el perímetro craneal o abdominal); y el martillo de reflejos sirve para explorar los reflejos neurológicos."},{"id":96,"temaId":"tema-4","tema":"Tema 4. Material para exploraciones médicas","subtemaId":"4.3","subtema":"4.3. Material de exploración otorrinolaringológica","enunciado":"En la consulta de otorrinolaringología el especialista solicita un espejo frontal de exploración junto con un otoscopio digital. ¿Para qué sirve el espejo frontal y qué ventaja ofrece el otoscopio digital frente al convencional?","opciones":{"A":"Proyecta hacia una cavidad la luz de un foco externo, y el otoscopio digital permite ver y guardar imágenes en ordenador.","B":"Refleja la imagen invertida de las cuerdas vocales, y el otoscopio digital mide automáticamente la agudeza auditiva.","C":"Amplía la apertura de los orificios nasales externos, y el otoscopio digital aspira el cerumen mediante vacío integrado.","D":"Neutraliza los reflejos luminosos del pabellón auricular, y el otoscopio digital realiza punciones timpánicas guiadas."},"correcta":"A","explicacion":"El espejo frontal se coloca en la cabeza del explorador para proyectar hacia el oído, nariz o garganta el haz luminoso de un foco externo manteniendo las manos libres; por su parte, el otoscopio digital puede conectarse al ordenador para visualizar, ampliar y almacenar las imágenes del conducto auditivo y el tímpano."},{"id":97,"temaId":"tema-4","tema":"Tema 4. Material para exploraciones médicas","subtemaId":"4.3","subtema":"4.3. Material de exploración otorrinolaringológica","enunciado":"Para atender consecutivamente a tres pacientes en la consulta de otología —uno con posible hipoacusia, otro con tapón de cerumen y un tercero que precisa drenaje de oído medio—, ¿qué tres instrumentos específicos corresponden a cada caso?","opciones":{"A":"Espéculo nasal para la hipoacusia, rinoscopio posterior para el tapón y pinza acodada para el drenaje.","B":"Laringoscopio de hoja curva para la hipoacusia, abrebocas para el tapón y espejo laríngeo para el drenaje.","C":"Otoscopio convencional para la hipoacusia, pinzas de Magill para el tapón y depresor metálico para el drenaje.","D":"Diapasón para valorar la audición, jeringa de agua para extraer el tapón y miringótomo para perforar el tímpano."},"correcta":"D","explicacion":"En otología, el diapasón sirve para explorar la audición; la jeringa de agua (de gran capacidad) se utiliza para irrigar el conducto auditivo y extraer tapones de cera; y el miringótomo es el instrumento cortante fino destinado a perforar la membrana timpánica (miringotomía)."},{"id":98,"temaId":"tema-4","tema":"Tema 4. Material para exploraciones médicas","subtemaId":"4.3","subtema":"4.3. Material de exploración otorrinolaringológica","enunciado":"Entre el material específico de otorrinolaringología, el TCAE distingue unas pinzas largas cuyos brazos presentan una marcada angulación respecto al eje del mango. ¿Qué nombre reciben estas pinzas y en qué cavidades se utilizan?","opciones":{"A":"Pinzas de Forester, empleadas exclusivamente para sujetar gasas en el conducto auditivo externo.","B":"Pinzas acodadas, diseñadas para introducir o extraer material en las cavidades bucal y nasal.","C":"Pinzas de Kelly, utilizadas para clampar vasos hemorrágicos en la región amigdalina posterior.","D":"Pinzas de Michel, destinadas a retirar los puntos metálicos de la mucosa tras una septoplastia."},"correcta":"B","explicacion":"Las pinzas acodadas (en bayoneta o acodadas de ORL) poseen esa forma angular para que la mano del explorador no tape la visión al trabajar dentro de cavidades estrechas y profundas como la nariz y la boca (o el oído)."},{"id":99,"temaId":"tema-4","tema":"Tema 4. Material para exploraciones médicas","subtemaId":"4.3","subtema":"4.3. Material de exploración otorrinolaringológica","enunciado":"En el caso práctico de la unidad, una niña de dos años acude a urgencias tras haberse introducido un objeto pequeño en una fosa nasal. ¿Qué instrumental básico debe preparar el TCAE para que el médico realice la exploración y extracción?","opciones":{"A":"Un laringoscopio de hoja recta Macintosh, un depresor metálico y un trócar de punción.","B":"Un diapasón metálico, una jeringa de agua templada y un miringótomo estéril.","C":"Un espéculo nasal o rinoscopio con fuente de luz para explorar y pinzas nasales para extraerlo.","D":"Un otoscopio con cono ancho, un espejo frontal y un asa de amigdalectomía."},"correcta":"C","explicacion":"Para localizar y retirar un cuerpo extraño alojado en la fosa nasal se necesita un espéculo nasal (o rinoscopio) junto con una fuente de luz para dilatar y visualizar la cavidad, y unas pinzas nasales (o acodadas) para sujetar y extraer el objeto con seguridad."},{"id":100,"temaId":"tema-4","tema":"Tema 4. Material para exploraciones médicas","subtemaId":"4.3","subtema":"4.3. Material de exploración otorrinolaringológica","enunciado":"Al revisar las técnicas de exploración nasal y los equipos multifunción de pared presentes en las consultas modernas de ORL, ¿qué vías de acceso permite el rinoscopio y qué tres instrumentos integra el equipo compacto Ri-Former®?","opciones":{"A":"El rinoscopio accede solo por las coanas y el Ri-Former® integra diapasón, aspirador y espejo frontal.","B":"El rinoscopio accede por orificios nasales externos o por las coanas, y el Ri-Former® integra otoscopio, oftalmoscopio y rinoscopio.","C":"El rinoscopio accede únicamente por el tabique anterior y el Ri-Former® integra laringoscopio, glucómetro y fonendoscopio.","D":"El rinoscopio accede a través del conducto auditivo y el Ri-Former® integra tensiómetro, pulsioxímetro y termómetro."},"correcta":"B","explicacion":"La rinoscopia permite explorar la cavidad nasal tanto por vía anterior (a través de los orificios nasales externos) como por vía posterior (a través de las coanas). El módulo de pared Ri-Former® agrupa habitualmente otoscopio, oftalmoscopio y rinoscopio con iluminación integrada."},{"id":101,"temaId":"tema-4","tema":"Tema 4. Material para exploraciones médicas","subtemaId":"4.3","subtema":"4.3. Material de exploración otorrinolaringológica","enunciado":"Antes de realizar una intubación endotraqueal, la enfermera pide al TCAE que compruebe el correcto encendido de la luz del laringoscopio y seleccione la hoja solicitada por el anestesista. ¿Qué dos modelos clásicos de hoja corresponden a las versiones curva y recta?","opciones":{"A":"La hoja de Macintosh corresponde al diseño curvo y la hoja de Miller al diseño recto.","B":"La hoja de Miller corresponde al diseño curvo y la hoja de Macintosh al diseño recto.","C":"La hoja de Farabeuf corresponde al diseño curvo y la hoja de Sims al diseño recto.","D":"La hoja de Yankauer corresponde al diseño curvo y la hoja de Frazier al diseño recto."},"correcta":"A","explicacion":"El laringoscopio consta de mango (donde van las pilas o batería) y hoja o pala con luz; los dos tipos clásicos descritos son la pala curva de Macintosh y la pala recta de Miller."},{"id":102,"temaId":"tema-4","tema":"Tema 4. Material para exploraciones médicas","subtemaId":"4.3","subtema":"4.3. Material de exploración otorrinolaringológica","enunciado":"Durante una exploración o maniobra terapéutica prolongada en la cavidad orofaríngea, el facultativo coloca un abrebocas al paciente. ¿Cuál es la finalidad preventiva principal de este dispositivo en la garganta?","opciones":{"A":"Deprimir la base lingual hacia abajo para evitar el reflejo nauseoso durante la inspección.","B":"Alinear el eje de la vía aérea superior para introducir sondas gástricas sin laringoscopio.","C":"Evitar que el paciente cierre bruscamente la mandíbula y sufra o cause lesiones por mordedura.","D":"Dilatar los conductos nasofaríngeos posteriores para facilitar la visualización con espejo laríngeo."},"correcta":"C","explicacion":"El abrebocas mantiene la cavidad bucal abierta de forma segura durante las exploraciones o intubaciones, impidiendo que el paciente cierre la boca involuntariamente y evitando lesiones por mordedura tanto en su propia lengua como en los dedos o instrumentos del profesional."},{"id":103,"temaId":"tema-4","tema":"Tema 4. Material para exploraciones médicas","subtemaId":"4.3","subtema":"4.3. Material de exploración otorrinolaringológica","enunciado":"En una intervención de amigdalectomía, el cirujano utiliza primero un instrumento provisto de un alambre o anillo que rodea el tejido y después otro para extraerlo definitivamente. ¿Qué dos piezas específicas desempeñan estas funciones?","opciones":{"A":"El miringótomo para rodear la cápsula y las pinzas de Guyon para traccionar el tejido.","B":"El diapasón de exploración y el espéculo laríngeo con mango metálico acodado.","C":"El rinoscopio anterior de válvulas y las pinzas de Desjardins para conductos profundos.","D":"El asa de amigdalectomía para sujetar y traccionar y las pinzas de amígdala para extraerla."},"correcta":"D","explicacion":"En la cirugía de garganta (amigdalectomía) se emplea el asa de amigdalectomía para sujetar y traccionar la amígdala y las pinzas específicas de amígdala para completar su aprehensión y extracción."},{"id":104,"temaId":"tema-4","tema":"Tema 4. Material para exploraciones médicas","subtemaId":"4.3","subtema":"4.3. Material de exploración otorrinolaringológica","enunciado":"Al estudiar el material de exploración de garganta se vuelve a mencionar un instrumento que ya aparecía en el material básico de exploración. ¿Qué instrumento figura en ambos apartados y qué doble utilidad cumple en la zona laríngea?","opciones":{"A":"El estilete abotonado, que sirve para drenar abscesos periamigdalinos y medir las coanas.","B":"Las pinzas de Magill, que sirven para retirar cuerpos extraños y guiar el tubo endotraqueal.","C":"La sonda acanalada, que sirve para deprimir la lengua y aspirar secreciones salivares.","D":"El trócar de punción, que sirve para perforar el tímpano y tomar biopsias de las amígdalas."},"correcta":"B","explicacion":"Las pinzas de Magill aparecen tanto en el apartado 4.1 (material básico) como en el 4.3 (exploración de garganta) por su utilidad para extraer cuerpos extraños de la faringe/garganta y dirigir el tubo endotraqueal hacia la laringe."},{"id":105,"temaId":"tema-5","tema":"Tema 5. Otros materiales e instrumentación","subtemaId":"5.1","subtema":"5.1. Medición y monitorización","enunciado":"En una unidad de cuidados críticos, un monitor registra de forma continua las constantes vitales de un paciente ingresado. ¿De qué dos maneras muestran la información estos monitores y qué responsabilidad diaria asume el TCAE respecto al aparato?","opciones":{"A":"Mediante señales acústicas codificadas y colores, debiendo el TCAE ajustar los límites de alarma.","B":"De forma numérica o mediante gráficas y curvas, debiendo el TCAE vigilar su estado, limpieza y funcionamiento.","C":"Únicamente en papel térmico continuo, debiendo el TCAE interpretar las ondas miocárdicas cada turno.","D":"A través de barras luminosas de color, debiendo el TCAE calibrar internamente los sensores electrónicos."},"correcta":"B","explicacion":"Los monitores presentan los datos fisiológicos en pantalla de forma numérica y/o mediante gráficas o curvas (trazados). El TCAE no interpreta el diagnóstico ni reprograma alarmas médicas, pero sí debe vigilar su estado, limpieza, acondicionamiento y correcto funcionamiento."},{"id":106,"temaId":"tema-5","tema":"Tema 5. Otros materiales e instrumentación","subtemaId":"5.1","subtema":"5.1. Medición y monitorización","enunciado":"Al preparar a un paciente para dos pruebas diagnósticas de registro bioeléctrico, la enfermera solicita al TCAE el equipo de electrocardiógrafo en un box y el de electroencefalógrafo en otro. ¿Qué diferencia visible en la colocación de los sensores distingue ambos registros?","opciones":{"A":"El electrocardiógrafo emplea electrodos sobre el tórax y extremidades, y el electroencefalógrafo usa un casco en la cabeza.","B":"El electrocardiógrafo utiliza un sensor digital en el dedo índice, y el electroencefalógrafo emplea un manguito braquial.","C":"El electrocardiógrafo se conecta al tubo endotraqueal del paciente, y el electroencefalógrafo se fija mediante cinta abdominal.","D":"El electrocardiógrafo utiliza electrodos en la región cefálica, y el electroencefalógrafo los aplica sobre la cara anterior torácica."},"correcta":"A","explicacion":"El electrocardiógrafo registra la actividad eléctrica del corazón mediante electrodos colocados sobre el cuerpo (tórax y extremidades), mientras que el electroencefalógrafo registra la actividad eléctrica cerebral mediante electrodos colocados sobre la cabeza (habitualmente integrados en un gorro o casco)."},{"id":107,"temaId":"tema-5","tema":"Tema 5. Otros materiales e instrumentación","subtemaId":"5.1","subtema":"5.1. Medición y monitorización","enunciado":"En una habitación de la UCI, un paciente con insuficiencia respiratoria grave permanece conectado a ventilación mecánica controlada. ¿En qué situaciones clínicas se utiliza el monitor respiratorio y a qué equipo suele acoplarse?","opciones":{"A":"Se usa solo durante pruebas de esfuerzo ambulatorias acoplado a una cinta continua de desplazamiento.","B":"Se usa exclusivamente en neonatos prematuros sanos acoplado al monitor fetal Doppler externo.","C":"Se usa en consultas de otorrinolaringología acoplado al rinoscopio de pared de fibra óptica.","D":"Se usa en pacientes intubados, con traqueostomía o mascarilla VPP, acoplado al respirador automático."},"correcta":"D","explicacion":"El monitor respiratorio mide el volumen, flujo y presiones de aire que recibe el paciente; se utiliza en personas intubadas, con traqueostomía o con mascarilla de ventilación con presión positiva (VPP), generalmente acoplado al respirador automático."},{"id":108,"temaId":"tema-5","tema":"Tema 5. Otros materiales e instrumentación","subtemaId":"5.1","subtema":"5.1. Medición y monitorización","enunciado":"Un TCAE coloca el sensor de un pulsioxímetro para vigilar de forma continua la saturación de oxígeno en sangre y la frecuencia cardíaca. ¿En qué localizaciones anatómicas se aplica este dispositivo según se trate de un adulto o de un neonato?","opciones":{"A":"En el tórax anterior en adultos y sobre el abdomen materno mediante gel en recién nacidos.","B":"En la mucosa bucal en adultos y alrededor del antebrazo con manguito inflable en neonatos.","C":"En un dedo o lóbulo de la oreja en adultos y rodeando el pie en el caso de neonatos.","D":"En la axila derecha en adultos y directamente sobre la fontanela craneal en neonatos."},"correcta":"C","explicacion":"El pulsioxímetro mide de forma no invasiva la saturación arterial de oxígeno (SpO2) y el pulso; en adultos y niños mayores suele colocarse en forma de pinza en un dedo o en el lóbulo de la oreja, mientras que en neonatos se adapta rodeando el pie (o la palma)."},{"id":109,"temaId":"tema-5","tema":"Tema 5. Otros materiales e instrumentación","subtemaId":"5.1","subtema":"5.1. Medición y monitorización","enunciado":"Durante una anestesia general en quirófano, el equipo vigila un parámetro conectado al circuito respiratorio para confirmar la correcta ventilación alveolar y la colocación del tubo endotraqueal. ¿Qué mide exactamente el capnógrafo?","opciones":{"A":"La presión arterial invasiva en la arteria radial durante cada sístole ventricular.","B":"El porcentaje de oxígeno inspirado que llega al alvéolo pulmonar en cada ciclo.","C":"La actividad eléctrica de los músculos intercostales durante la fase inspiratoria.","D":"La concentración de dióxido de carbono presente en el aire espirado por el paciente."},"correcta":"D","explicacion":"El capnógrafo es el instrumento de monitorización encargado de medir y representar la concentración de dióxido de carbono (CO2) en el aire espirado (capnometría y capnografía)."},{"id":110,"temaId":"tema-5","tema":"Tema 5. Otros materiales e instrumentación","subtemaId":"5.1","subtema":"5.1. Medición y monitorización","enunciado":"Una gestante en trabajo de parto ingresa en la sala de dilatación y la matrona solicita la colocación de un monitor fetal. ¿Qué dos variables registra este equipo y con qué objetivo clínico fundamental?","opciones":{"A":"El ritmo cardíaco fetal por Doppler y las contracciones uterinas, para detectar posible sufrimiento fetal.","B":"La saturación capilar materna y la presión arterial diastólica, para calcular el volumen amniótico.","C":"La actividad cerebral del feto y la dilatación cervical en centímetros, para programar el legrado.","D":"La temperatura intrauterina y el nivel de CO2 espirado materno, para prevenir la hipoglucemia neonatal."},"correcta":"A","explicacion":"El monitor fetal (cardiotocógrafo) registra simultáneamente la frecuencia cardíaca fetal (mediante ultrasonidos por efecto Doppler) y la intensidad y frecuencia de las contracciones uterinas maternas, permitiendo detectar precozmente signos de sufrimiento fetal."},{"id":111,"temaId":"tema-5","tema":"Tema 5. Otros materiales e instrumentación","subtemaId":"5.1","subtema":"5.1. Medición y monitorización","enunciado":"En la unidad de cuidados intensivos se utiliza un monitor multiparamétrico como el representado en el manual. ¿Qué cinco constantes vitales básicas integra habitualmente en una única pantalla este tipo de monitor?","opciones":{"A":"Electroencefalograma, presión venosa central, glucemia capilar, pulso fetal y temperatura.","B":"Ritmo de perfusión, contracciones uterinas, volumen tidal, presión arterial y electrocardiograma.","C":"Electrocardiograma, presión arterial, saturación de oxígeno, CO2 espirado y temperatura.","D":"Electroencefalograma, diuresis horaria, saturación venosa, frecuencia cardíaca y presión arterial."},"correcta":"C","explicacion":"Los monitores multiparamétricos de UCI y quirófano agrupan en una misma pantalla cinco registros clave: el electrocardiograma (EKG), la presión arterial, la saturación de oxígeno (pulsioximetría), el dióxido de carbono espirado (capnografía) y la temperatura corporal."},{"id":112,"temaId":"tema-5","tema":"Tema 5. Otros materiales e instrumentación","subtemaId":"5.1","subtema":"5.1. Medición y monitorización","enunciado":"Al clasificar el equipamiento eléctrico de una unidad hospitalaria, ¿qué conjunto de dispositivos pertenece íntegramente al apartado de medición y monitorización descrito en la unidad?","opciones":{"A":"Ambú®, respirador automático, monitor desfibrilador, nebulizador ultrasónico y aspirador quirúrgico.","B":"Bomba de perfusión endovenosa, endoscopio digestivo, ecógrafo portátil y litotriptor extracorpóreo.","C":"Laringoscopio de Macintosh, otoscopio digital, espejo frontal de exploración y diapasón metálico.","D":"Electrocardiógrafo, electroencefalógrafo, pulsioxímetro, capnógrafo, monitor respiratorio y monitor fetal."},"correcta":"D","explicacion":"El apartado 5.1 (Medición y monitorización) comprende específicamente el electrocardiógrafo, el electroencefalógrafo, el monitor respiratorio, el pulsioxímetro, el capnógrafo y el monitor fetal (integrables en monitores multiparamétricos)."},{"id":113,"temaId":"tema-5","tema":"Tema 5. Otros materiales e instrumentación","subtemaId":"5.2","subtema":"5.2. Reanimación","enunciado":"Ante una parada respiratoria súbita en planta, el TCAE acerca el carro de paradas y entrega un resucitador manual Ambú® al personal sanitario. ¿Qué componente principal lo forma y a qué elementos puede acoplarse para ventilar al paciente?","opciones":{"A":"Un compresor eléctrico portátil que se acopla exclusivamente a cánulas nasales de bajo flujo.","B":"Un balón autoinflable de caucho o goma que se acopla a un tubo endotraqueal o a una mascarilla.","C":"Una botella portátil de aire comprimido conectada directamente al aspirador de secreciones.","D":"Un fuelle metálico articulado que se fija mediante electrodos adhesivos al tórax del paciente."},"correcta":"B","explicacion":"El Ambú® (resucitador manual) consiste en un balón autoinflable de caucho o goma provisto de una válvula unidireccional que puede acoplarse tanto a una mascarilla facial (adaptada a boca y nariz) como directamente a un tubo endotraqueal o cánula de traqueostomía."},{"id":114,"temaId":"tema-5","tema":"Tema 5. Otros materiales e instrumentación","subtemaId":"5.2","subtema":"5.2. Reanimación","enunciado":"Un respirador automático sustituye de forma prolongada la función ventilatoria cuando el paciente no puede respirar eficazmente por sí mismo. ¿En qué cuatro contextos asistenciales indica el manual su utilización habitual?","opciones":{"A":"En UCI, pacientes inconscientes o sedados, cirugía intratorácica y enfermos respiratorios crónicos.","B":"En consultas externas de dermatología, curas de heridas leves, partos eutócicos y otoscopia.","C":"En pruebas de agudeza auditiva, control de glucemia capilar, endoscopia nasal y extracciones.","D":"En el traslado de muestras biológicas, limpieza de carros de curas, sutura cutánea y antropometría."},"correcta":"A","explicacion":"Los respiradores automáticos (ventiladores mecánicos) se utilizan habitualmente en las unidades de cuidados intensivos (UCI), en pacientes inconscientes o bajo sedación profunda, durante la cirugía intratorácica y en determinados enfermos respiratorios crónicos."},{"id":115,"temaId":"tema-5","tema":"Tema 5. Otros materiales e instrumentación","subtemaId":"5.2","subtema":"5.2. Reanimación","enunciado":"Durante una intervención de cirugía intratorácica abierta, el equipo anestésico mantiene obligatoriamente conectado al paciente a un respirador automático. ¿Qué complicación fisiológica crítica previene la ventilación mecánica al abrir la cavidad pleural?","opciones":{"A":"La broncoaspiración gástrica secundaria a la pérdida del reflejo de deglución.","B":"La sobrecarga inmediata de dióxido de carbono por obstrucción del capnógrafo.","C":"El colapso de los pulmones provocado al perderse la presión negativa intratorácica.","D":"La deshidratación de los alvéolos al entrar en contacto con el aire ambiental seco."},"correcta":"C","explicacion":"Al abrir la cavidad torácica en cirugía intratorácica se pierde la presión negativa pleural y los pulmones tienden a colapsarse; el respirador automático mantiene insuflados los pulmones mediante presión positiva controlada, evitando su colapso."},{"id":116,"temaId":"tema-5","tema":"Tema 5. Otros materiales e instrumentación","subtemaId":"5.2","subtema":"5.2. Reanimación","enunciado":"En el carro de paradas de urgencias hospitalarias se encuentra un monitor desfibrilador preparado para emergencias cardiológicas. ¿Qué tres funciones terapéuticas puede realizar este equipo sobre el corazón del paciente?","opciones":{"A":"Aspiración bronquial continua, nebulización broncodilatadora y oxigenoterapia hiperbárica.","B":"Desfibrilación eléctrica, cardioversión sincronizada y estimulación como marcapasos.","C":"Perfusión endovenosa regulada, capnografía espiratoria y registro electroencefalográfico.","D":"Ventilación automática por presión positiva, pulsioximetría capilar y litotricia cardíaca."},"correcta":"B","explicacion":"El monitor desfibrilador combina la monitorización del electrocardiograma con la capacidad de aplicar descargas para desfibrilación (ante fibrilación ventricular o taquicardia sin pulso), cardioversión sincronizada (para revertir ciertas arritmias) y estimulación eléctrica externa como marcapasos temporal."},{"id":117,"temaId":"tema-5","tema":"Tema 5. Otros materiales e instrumentación","subtemaId":"5.2","subtema":"5.2. Reanimación","enunciado":"Al comparar en clase el Ambú® con el respirador automático, un alumno pregunta en qué reside la diferencia operativa fundamental entre ambos dispositivos de reanimación. ¿Cuál es la respuesta correcta?","opciones":{"A":"El Ambú® proporciona ventilación manual temporal mientras el respirador asegura ventilación automática prolongada.","B":"El Ambú® se utiliza exclusivamente en cirugías intratorácicas mientras el respirador se reserva para consultas.","C":"El Ambú® regula automáticamente el volumen espiratorio mientras el respirador depende de la fuerza del reanimador.","D":"El Ambú® solo funciona conectado a una toma eléctrica de pared mientras el respirador es un balón autoinflable."},"correcta":"A","explicacion":"Ambos suministran ventilación, pero el Ambú® es manual y se utiliza de forma temporal o de urgencia (hasta intubar o conectar un equipo mecánico), mientras que el respirador automático sustituye la respiración del paciente de forma mecánica, programada y prolongada."},{"id":118,"temaId":"tema-5","tema":"Tema 5. Otros materiales e instrumentación","subtemaId":"5.3","subtema":"5.3. Aspiración","enunciado":"En la unidad de reanimación posquirúrgica es necesario disponer de sistemas de aspiración operativos en todo momento. ¿Qué elemento básico recoge el material aspirado y de qué dos formas pueden alimentarse estos equipos según el área hospitalaria?","opciones":{"A":"Recogen el líquido en filtros de papel absorbente y se conectan solo a botellas de oxígeno comprimido.","B":"Recogen el contenido en ampollas estériles de vidrio y funcionan exclusivamente mediante pedales mecánicos.","C":"Recogen las secreciones en bolsas textiles permeables y se conectan al monitor multiparamétrico central.","D":"Recogen el contenido en un depósito colector y pueden ser portátiles eléctricos o conectados a la toma de vacío."},"correcta":"D","explicacion":"Los sistemas de aspiración cuentan con un depósito o frasco colector donde se acumulan los fluidos aspirados (sangre, secreciones, serosidad) y pueden ser aparatos portátiles con motor propio o equipos acoplados a las tomas centrales de vacío de quirófanos y habitaciones."},{"id":119,"temaId":"tema-5","tema":"Tema 5. Otros materiales e instrumentación","subtemaId":"5.3","subtema":"5.3. Aspiración","enunciado":"Fuera del quirófano, un paciente encamado presenta abundante acúmulo de mucosidad orofaríngea y precisa además una intubación endotraqueal urgente. ¿Para qué finalidad clínica principal se emplea el aspirador de secreciones en estas situaciones?","opciones":{"A":"Para administrar fármacos broncodilatadores en forma de aerosol fino hasta los bronquiolos.","B":"Para medir con exactitud la concentración de dióxido de carbono presente en cada espiración.","C":"Para retirar secreciones excesivas o sangre de la boca y vía aérea y mantenerla permeable.","D":"Para insuflar aire a presión positiva en el interior de los pulmones evitando su colapso."},"correcta":"C","explicacion":"En planta o urgencias, el aspirador de secreciones sirve para retirar secreciones excesivas, vómitos o sangre de la cavidad bucal y la vía aérea (por ejemplo antes o durante una intubación endotraqueal), manteniendo despejada la vía respiratoria."},{"id":120,"temaId":"tema-5","tema":"Tema 5. Otros materiales e instrumentación","subtemaId":"5.3","subtema":"5.3. Aspiración","enunciado":"Tras utilizar un aspirador de secreciones portátil en una habitación de planta, ¿qué protocolo de mantenimiento y control corresponde realizar al TCAE?","opciones":{"A":"Desmontar la bomba eléctrica interna para enviarla al servicio de electromedicina tras cada aspiración.","B":"Vigilar su limpieza y acondicionamiento, gestionar el depósito colector y comprobar su funcionamiento.","C":"Sustituir los manómetros de vacío de la toma mural aunque el aparato portátil opere con batería.","D":"Almacenar el equipo directamente en el cuarto limpio con la bolsa usada puesta hasta el turno siguiente."},"correcta":"B","explicacion":"Al igual que con el resto de equipos asistenciales, el TCAE debe encargarse de la limpieza, desinfección y acondicionamiento del aspirador (vaciado/sustitución y limpieza del depósito colector y tubuladuras según protocolo) y comprobar que queda en perfecto estado de funcionamiento, comunicando cualquier anomalía al supervisor."},{"id":121,"temaId":"tema-5","tema":"Tema 5. Otros materiales e instrumentación","subtemaId":"5.4","subtema":"5.4. Otros equipos e instrumentos","enunciado":"En la actividad propuesta sobre Raquel, ingresada en la UVI, los médicos deciden administrar sueroterapia y medicación intravenosa manteniendo una velocidad constante y exacta durante varias horas. ¿Qué equipo específico cumple esta función?","opciones":{"A":"El nebulizador ultrasónico conectado a la toma central de oxígeno de la cabecera.","B":"La bomba de perfusión endovenosa, que administra fluidoterapia o fármacos a un ritmo determinado.","C":"El pulsioxímetro continuo fijado mediante pinza en el dedo índice de la paciente.","D":"El litotriptor extracorpóreo programado para emitir impulsos regulares sobre la vía venosa."},"correcta":"B","explicacion":"La bomba de perfusión endovenosa permite administrar fluidoterapia y medicación por vía intravenosa de forma controlada, continua y a un ritmo o caudal exacto predeterminado."},{"id":122,"temaId":"tema-5","tema":"Tema 5. Otros materiales e instrumentación","subtemaId":"5.4","subtema":"5.4. Otros equipos e instrumentos","enunciado":"Un paciente en proceso de destete de la ventilación mecánica precisa aumentar la humedad relativa del aire que respira y recibir broncodilatadores directamente en el árbol respiratorio. ¿Qué aparato se emplea para este fin y en qué otros equipos puede integrarse?","opciones":{"A":"El nebulizador, utilizado para humidificar o administrar fármacos y acoplable a incubadoras o respiradores.","B":"El capnógrafo, empleado para aportar vapor tibio al circuito respiratorio en neonatología y en urgencias.","C":"El aspirador quirúrgico portátil, adaptado para pulverizar medicación mucolítica hacia las vías aéreas altas.","D":"La bomba de perfusión continua, conectada al tubo endotraqueal para administrar soluciones en aerosol."},"correcta":"A","explicacion":"El nebulizador transforma líquidos en finas partículas en suspensión (aerosol) para aumentar la humedad relativa del aire inspirado o administrar fármacos en el aparato respiratorio; suele emplearse en destetes de ventilación mecánica y puede acoplarse a incubadoras y respiradores."},{"id":123,"temaId":"tema-5","tema":"Tema 5. Otros materiales e instrumentación","subtemaId":"5.4","subtema":"5.4. Otros equipos e instrumentos","enunciado":"¿Qué características funcionales definen al endoscopio médico y a través de qué dos vías de acceso permite explorar cavidades internas, tomar muestras o realizar intervenciones quirúrgicas mínimamente invasivas?","opciones":{"A":"Emite ondas de choque externas y accede únicamente por vía percutánea sobre planos óseos profundos.","B":"Utiliza ultrasonidos reflejados sobre la piel y accede exclusivamente mediante punciones arteriales.","C":"Funciona mediante luz ultravioleta fría y accede solo a través del conducto auditivo externo.","D":"Es un tubo flexible con cámara y luz que accede por un orificio natural o una pequeña incisión."},"correcta":"D","explicacion":"El endoscopio consta de un tubo con sistema óptico/cámara e iluminación que se introduce en el organismo bien a través de un orificio natural (boca, nariz, recto, uretra) o mediante una pequeña incisión quirúrgica (laparoscopia, artroscopia) para visualizar órganos, tomar biopsias u operar."},{"id":124,"temaId":"tema-5","tema":"Tema 5. Otros materiales e instrumentación","subtemaId":"5.4","subtema":"5.4. Otros equipos e instrumentos","enunciado":"En una consulta hospitalaria se solicita una prueba diagnóstica por imagen rápida, incruenta y sin radiación ionizante para observar estructuras internas en tiempo real. ¿En qué principio físico se basa el ecógrafo y qué ventajas clínicas destaca el documento?","opciones":{"A":"Se basa en rayos X de baja intensidad, destacando por su capacidad para visualizar tejidos óseos densos.","B":"Se basa en campos electromagnéticos intensos, destacando por generar reconstrucciones óseas sin contacto.","C":"Se basa en ultrasonidos reflejados, destacando por ser una técnica útil, económica, cómoda y no invasiva.","D":"Se basa en transiluminación por fibra óptica, destacando por sustituir por completo a la cirugía endoscópica."},"correcta":"C","explicacion":"El ecógrafo emite ultrasonidos que rebotan en las distintas estructuras internas formando imágenes en pantalla; el manual destaca que se trata de un método diagnóstico muy útil, económico, cómodo para el paciente y completamente no invasivo."},{"id":125,"temaId":"tema-5","tema":"Tema 5. Otros materiales e instrumentación","subtemaId":"5.4","subtema":"5.4. Otros equipos e instrumentos","enunciado":"De acuerdo con el contenido específico de la unidad sobre el diagnóstico ecográfico, ¿en qué tres especialidades médicas señala el texto que el uso del ecógrafo es especialmente frecuente?","opciones":{"A":"En Medicina interna, Obstetricia y Oftalmología.","B":"En Traumatología ósea, Dermatología y Psiquiatría.","C":"En Otorrinolaringología, Anatomía patológica y Podología.","D":"En Neumología intensiva, Odontología y Medicina nuclear."},"correcta":"A","explicacion":"Aunque la ecografía se ha extendido a múltiples áreas, el texto menciona expresamente su empleo habitual en Medicina interna, Obstetricia (control del embarazo) y Oftalmología."},{"id":126,"temaId":"tema-5","tema":"Tema 5. Otros materiales e instrumentación","subtemaId":"5.4","subtema":"5.4. Otros equipos e instrumentos","enunciado":"En la tabla clasificatoria final de \"Otros\" equipos asistenciales estudiados en el Tema 5, ¿qué cinco instrumentos o aparatos figuran agrupados junto a la bomba de perfusión y el nebulizador?","opciones":{"A":"Electrocardiógrafo, pulsioxímetro, capnógrafo, monitor fetal y glucómetro capilar.","B":"Ambú®, respirador automático, monitor desfibrilador, aspirador portátil y laringoscopio.","C":"Bomba de perfusión, nebulizador, endoscopio, ecógrafo y litotriptor extracorpóreo (LEC).","D":"Estilete metálico, sonda acanalada, trócar de biopsia, pinzas de Magill y otoscopio."},"correcta":"C","explicacion":"En la clasificación del Tema 5, el subgrupo \"Otros\" (5.4) reúne exactamente la bomba de perfusión endovenosa, el nebulizador, el endoscopio, el ecógrafo y el litotriptor extracorpóreo por ondas de choque (LEC)."},{"id":127,"temaId":"tema-6","tema":"Tema 6. Material desechable","subtemaId":"6.1","subtema":"6.1. Ventajas y clasificación del material desechable","enunciado":"Un servicio hospitalario sustituye determinados útiles reutilizables por equivalentes de un solo uso tras revisar sus protocolos de seguridad del paciente. ¿Cuál es la ventaja higiénica principal que aporta el material desechable en la asistencia sanitaria?","opciones":{"A":"Suprime por completo el riesgo de alergias cutáneas al evitar el contacto con plásticos sintéticos.","B":"Permite esterilizar las cajas metálicas a temperaturas mucho más bajas dentro de la unidad.","C":"Genera envases biodegradables que pueden eliminarse junto con la basura doméstica convencional.","D":"Evita problemas de higiene y reduce la transmisión de enfermedades, sobre todo infecciones nosocomiales."},"correcta":"D","explicacion":"Desde el punto de vista higiénico, el uso de material estéril desechable de un solo uso evita fallos de reprocesamiento y reduce drásticamente la transmisión cruzada de enfermedades y las infecciones nosocomiales (hospitalarias)."},{"id":128,"temaId":"tema-6","tema":"Tema 6. Material desechable","subtemaId":"6.1","subtema":"6.1. Ventajas y clasificación del material desechable","enunciado":"Además de la mejora en la seguridad higiénica frente a las infecciones, ¿qué otras dos ventajas —una económica y otra psicológica— explican la amplia implantación del material sanitario desechable?","opciones":{"A":"Aumenta la necesidad de espacio en almacén pero simplifica el control de fechas de caducidad.","B":"Elimina costes de limpieza, desinfección y esterilización y aporta tranquilidad al sanitario y al paciente.","C":"Reduce el volumen de residuos sanitarios generados y disminuye la frecuencia de pedidos de transporte.","D":"Suprime la formación del personal en técnicas asépticas y acelera el montaje de los carros sin reposición."},"correcta":"B","explicacion":"En el aspecto económico, el material desechable resulta más rentable al eliminar los gastos de recogida, limpieza, desinfección y esterilización del material reutilizable; en el plano psicológico, aporta gran tranquilidad tanto al profesional sanitario como al paciente al saber que se estrena un artículo estéril."},{"id":129,"temaId":"tema-6","tema":"Tema 6. Material desechable","subtemaId":"6.1","subtema":"6.1. Ventajas y clasificación del material desechable","enunciado":"Al organizar los cajones del almacén de planta por categorías funcionales de material fungible, ¿qué artículos pertenecen íntegramente al bloque de \"punción y vías endovenosas\"?","opciones":{"A":"Guantes de exploración, batas quirúrgicas, mascarillas de protección, gorros y calzas.","B":"Depresores linguales de madera, espéculos vaginales de plástico y conos de otoscopio.","C":"Agujas, jeringas, lancetas, catéteres endovenosos, cánulas intravenosas y palomillas.","D":"Bolsas colectoras de diuresis, sondas vesicales de látex y sondas nasogástricas."},"correcta":"C","explicacion":"Dentro de la clasificación del material desechable, el grupo de punción y acceso vascular incluye agujas, jeringas, lancetas de punción capilar, catéteres endovenosos, cánulas y palomillas."},{"id":130,"temaId":"tema-6","tema":"Tema 6. Material desechable","subtemaId":"6.1","subtema":"6.1. Ventajas y clasificación del material desechable","enunciado":"En una planta de hospitalización médica, el TCAE repone dos carros auxiliares distintos: uno con equipamiento de barrera profesional y otro para el control de eliminaciones del paciente. ¿Qué artículos corresponden respectivamente a protección y a recogida de excreciones?","opciones":{"A":"Guantes, batas, gorros y calzas para protección; bolsas de diuresis, sondas vesicales y nasogástricas para excreciones.","B":"Paños de campo adhesivos y vendas elásticas para protección; jeringas de insulina y lancetas para excreciones.","C":"Gasas estériles y esparadrapos hipoalergénicos para protección; agujas de biopsia y catéteres para excreciones.","D":"Espéculos nasales y conos desechables para protección; sistemas de infusión y drenajes cerrados para excreciones."},"correcta":"A","explicacion":"Los equipos de protección desechables incluyen guantes, batas, mascarillas, gorros y calzas; los artículos de recogida de excreciones comprenden bolsas colectoras de diuresis, sondas vesicales, sondas nasogástricas y recipientes para muestras."},{"id":131,"temaId":"tema-6","tema":"Tema 6. Material desechable","subtemaId":"6.1","subtema":"6.1. Ventajas y clasificación del material desechable","enunciado":"Al preparar la consulta diaria de Atención Primaria y Ginecología, ¿qué tres artículos desechables corresponden específicamente al apartado de exploración clínica?","opciones":{"A":"Paños de campo fenestrados, pijamas quirúrgicos y cubrezapatos impermeables.","B":"Depresores linguales, espéculos de plástico y conos para otoscopio y rinoscopio.","C":"Maquinillas de rasurado preoperatorio, esponjas jabonosas y empapadores de cama.","D":"Agujas hipodérmicas, palomillas de infusión periférica y llaves de tres pasos."},"correcta":"B","explicacion":"Entre los materiales desechables destinados a la exploración destacan los depresores linguales (madera o plástico), los espéculos vaginales de plástico y los conos o espéculos desechables para otoscopio y rinoscopio."},{"id":132,"temaId":"tema-6","tema":"Tema 6. Material desechable","subtemaId":"6.1","subtema":"6.1. Ventajas y clasificación del material desechable","enunciado":"En la actividad sobre Alicia, tras realizar una cura en una herida quirúrgica, quedan sobre el carro guantes usados, gasas manchadas, una jeringa con aguja, una batea metálica y unas tijeras de Mayo. ¿Cómo debe clasificar y gestionar Alicia este material?","opciones":{"A":"Esterilizar todo el lote en autoclave para ahorrar material fungible en las curas posteriores.","B":"Desechar todos los artículos usados en la bolsa lateral de residuos sin separar los instrumentos.","C":"Lavar las gasas y guantes con antiséptico y guardar la aguja dentro de la caja metálica estéril.","D":"Desechar el material fungible en los contenedores adecuados y procesar tijeras y batea reutilizables."},"correcta":"D","explicacion":"Los guantes, gasas, jeringas y agujas son material desechable (los punzantes como la aguja irán al contenedor rígido específico y el resto al contenedor de residuos correspondiente); en cambio, las tijeras de Mayo y la batea metálica son reutilizables y deben limpiarse, desinfectarse y enviarse a esterilización."},{"id":133,"temaId":"tema-6","tema":"Tema 6. Material desechable","subtemaId":"6.1","subtema":"6.1. Ventajas y clasificación del material desechable","enunciado":"En la consulta de Traumatología se retiran grapas metálicas con un quitagrapas desechable y puntos de sutura con unas tijeras de Littauer reutilizables. ¿Qué destino correcto corresponde a cada instrumento al concluir el procedimiento?","opciones":{"A":"El quitagrapas desechable va al contenedor de residuos y las tijeras de Littauer al ciclo de esterilización.","B":"Tanto el quitagrapas como las tijeras de Littauer deben remitirse juntos a la central de esterilización.","C":"Ambos dispositivos se desechan en la bolsa de residuos tras la retirada de la sutura cutánea.","D":"Las tijeras de Littauer se limpian con gasa desinfectante y se devuelven directamente a la caja del carro."},"correcta":"A","explicacion":"El quitagrapas de plástico/metal de un solo uso es material desechable que debe eliminarse en el contenedor correspondiente tras usarse; las tijeras de Littauer son instrumental metálico reutilizable que debe someterse a limpieza, desinfección y esterilización."},{"id":134,"temaId":"tema-6","tema":"Tema 6. Material desechable","subtemaId":"6.1","subtema":"6.1. Ventajas y clasificación del material desechable","enunciado":"Al revisar las categorías de material fungible de uso hospitalario, ¿qué grupo integra los sistemas de infusión, diálisis, transfusión y drenaje, y en qué grupo se incluyen las esponjas jabonosas y maquinillas de rasurado?","opciones":{"A":"Pertenecen ambos grupos al apartado exclusivo de material quirúrgico de quirófano.","B":"Los sistemas citados forman parte del grupo terapéutico/asistencial y esponjas y maquinillas son de higiene y rasurado.","C":"Los sistemas citados son de exploración clínica y esponjas y maquinillas pertenecen a protección de barrera.","D":"Los sistemas citados se clasifican en recogida de excreciones y esponjas y maquinillas en material de sutura."},"correcta":"B","explicacion":"Dentro de la clasificación habitual del material desechable, los sistemas de infusión, diálisis, transfusión y drenaje se agrupan como material terapéutico/asistencial (tratamientos), mientras que las esponjas jabonosas y maquinillas de rasurar forman parte del material desechable de higiene y preparación preoperatoria."},{"id":135,"temaId":"tema-6","tema":"Tema 6. Material desechable","subtemaId":"6.1","subtema":"6.1. Ventajas y clasificación del material desechable","enunciado":"En el bloque quirúrgico moderno, ¿qué artículos textiles estériles de barrera se emplean de forma generalizada como material desechable para vestir al equipo y aislar al paciente?","opciones":{"A":"Las cajas metálicas perforadas y las bandejas de acero inoxidable para el instrumental.","B":"Los retractores estáticos abdominales y las pinzas de campo reutilizables con cremallera.","C":"La ropa de quirófano (batas, pijamas, gorros, mascarillas) y los paños de campo adhesivos.","D":"Los manguitos neumáticos de tensiómetro y las membranas acústicas de los fonendoscopios."},"correcta":"C","explicacion":"En la clasificación del material desechable habitual destacan las prendas de protección y ropa de quirófano de un solo uso, así como los paños quirúrgicos estériles con banda adhesiva que sustituyen a los textiles reutilizables y a las pinzas de campo metálicas."},{"id":136,"temaId":"tema-7","tema":"Tema 7. El carro de curas","subtemaId":"7.1","subtema":"7.1. Características y material del carro de curas","enunciado":"Al explicar a un alumno de primer curso la utilidad asistencial y la ubicación estándar del carro de curas en una planta de hospitalización, ¿qué afirmación es correcta?","opciones":{"A":"Sirve exclusivamente para almacenar medicación oral y se guarda cerrado en el almacén general.","B":"Sirve para trasladar muestras al laboratorio y permanece estacionado en el pasillo principal.","C":"Sirve para transportar equipos de rayos X portátiles y se ubica dentro de la sala de esterilización.","D":"Sirve para llevar el material necesario a las habitaciones y se guarda en el control de enfermería."},"correcta":"D","explicacion":"El carro de curas permite trasladar cómodamente todo el material necesario para realizar las curas en las habitaciones de los pacientes sin tener que entrar y salir repetidamente; cuando no se utiliza, permanece guardado y limpio en el control de enfermería (o cuarto de curas)."},{"id":137,"temaId":"tema-7","tema":"Tema 7. El carro de curas","subtemaId":"7.1","subtema":"7.1. Características y material del carro de curas","enunciado":"Si una unidad va a adquirir un nuevo carro de curas hospitalario, ¿qué conjunto de características físicas y estructurales debe reunir conforme a las especificaciones del tema?","opciones":{"A":"Estructura fija de madera barnizada con cuatro cajones cerrados y soporte superior para sueros.","B":"Estructura rodante y ligera con dos o tres bandejas con compartimentos y soporte lateral para residuos.","C":"Estructura pesada de hierro sin ruedas giratorias con una sola bandeja honda y tapa hermética.","D":"Estructura plegable de aluminio con cinco estantes abiertos sin compartimentos y freno eléctrico central."},"correcta":"B","explicacion":"El carro de curas debe ser rodante (con ruedas giratorias), ligero y fácil de limpiar (habitualmente acero inoxidable o material lavable), contar con dos o tres bandejas paralelas con cajones/compartimentos para clasificar el material e incorporar un soporte lateral con bolsa para recoger los residuos."},{"id":138,"temaId":"tema-7","tema":"Tema 7. El carro de curas","subtemaId":"7.1","subtema":"7.1. Características y material del carro de curas","enunciado":"Al revisar las soluciones líquidas que deben estar siempre disponibles en el carro de curas para el lavado de heridas y la antisepsia cutánea, ¿qué tres productos básicos menciona el manual?","opciones":{"A":"Agua destilada no estéril, alcohol metílico industrial y solución de hipoclorito sódico.","B":"Suero glucosado hipertónico, agua oxigenada concentrada y tintura de yodo sin diluir.","C":"Suero salino fisiológico (ClNa 0,9 %), povidona yodada y clorhexidina acuosa o alcohólica.","D":"Glutaraldehído activado al dos por ciento, éter etílico y detergente enzimático neutro."},"correcta":"C","explicacion":"Entre las soluciones básicas imprescindibles en el carro de curas figuran el suero salino fisiológico (ClNa al 0,9 %) para la limpieza/irrigación de heridas, y antisépticos como la povidona yodada y la clorhexidina."},{"id":139,"temaId":"tema-7","tema":"Tema 7. El carro de curas","subtemaId":"7.1","subtema":"7.1. Características y material del carro de curas","enunciado":"Un paciente presenta una úlcera superficial que requiere cobertura no adherente, fijación cutánea suave y protección en pulverizador en otra zona sin rozaduras. ¿Qué tres materiales específicos del carro de curas cumplen estas funciones?","opciones":{"A":"Tul graso (Tulgrasum®), esparadrapo hipoalergénico y vendaje plástico poroso en pulverizador.","B":"Vendas de escayola rápidas, suturas metálicas de acero inoxidable y paños quirúrgicos fenestrados.","C":"Catéteres endovenosos cortos, palomillas de calibre fino y bolsas colectoras de diuresis.","D":"Depresores linguales desechables, gasas no estériles de celulosa y vendas elásticas de compresión fuerte."},"correcta":"A","explicacion":"El carro de curas incluye tul graso (como Tulgrasum®) para evitar la adherencia del apósito al lecho de la herida, esparadrapo hipoalergénico para fijar los apósitos cuidando la piel y vendaje plástico poroso en pulverizador (apósito en spray) para cubrir determinadas heridas superficiales."},{"id":140,"temaId":"tema-7","tema":"Tema 7. El carro de curas","subtemaId":"7.1","subtema":"7.1. Características y material del carro de curas","enunciado":"Al verificar la dotación completa de la caja metálica estéril que se transporta en el carro de curas, ¿qué lista recoge correctamente el instrumental que debe contener?","opciones":{"A":"Espéculo vaginal, histerómetro de Sims, cucharilla uterina, trócar y retractor de Hill-Ferguson.","B":"Tijeras de Potts-Smith, separador de Finochietto, pinzas de Guyon, gubias y cizallas óseas.","C":"Sonda acanalada, pinzas de Pean y Kocher, estilete, bisturí, tijeras de Mayo, portaagujas y disección.","D":"Otoscopio digital, rinoscopio nasal, laringoscopio de Miller, diapasón y pinzas de amígdala."},"correcta":"C","explicacion":"La caja metálica estéril del carro de curas contiene el instrumental básico para curas y pequeñas suturas: sonda acanalada, estilete abotonado, pinzas hemostáticas (Pean, Kocher), bisturí (mango y hojas), tijeras de Mayo, portaagujas y pinzas de disección (con y sin dientes)."},{"id":141,"temaId":"tema-7","tema":"Tema 7. El carro de curas","subtemaId":"7.1","subtema":"7.1. Características y material del carro de curas","enunciado":"Además de la caja metálica, las soluciones antisépticas y el material de apósitos y suturas, ¿qué otros elementos complementarios completan habitualmente la dotación del carro de curas?","opciones":{"A":"Monitores multiparamétricos, bombas de perfusión, electrocardiógrafos y respiradores portátiles.","B":"Bateas y riñoneras, tijeras para vendajes, algodón, paños estériles y pomadas o anestésicos locales.","C":"Básculas con tallímetro, camillas articuladas, lámparas de pie y autoclaves de mesa.","D":"Ecógrafos portátiles, endoscopios digestivos, desfibriladores externos y monitores fetales."},"correcta":"B","explicacion":"El inventario del carro de curas se completa con bateas y riñoneras, tijeras fuertes para cortar vendajes o ropa, algodón hidrófilo, paños estériles, jeringas y agujas, guantes estériles y no estériles, gasas, vendas y pomadas o anestésicos locales según necesidad."},{"id":142,"temaId":"tema-7","tema":"Tema 7. El carro de curas","subtemaId":"7.1","subtema":"7.1. Características y material del carro de curas","enunciado":"Al seleccionar el material sanitario que formará parte de las bandejas del carro de curas, ¿qué dos cualidades básicas generales exige el tema que posean todos los materiales empleados sobre el paciente?","opciones":{"A":"Que ofrezcan un uso seguro y que no resulten irritantes para los tejidos o la piel.","B":"Que sean íntegramente metálicos y que soporten temperaturas superiores a doscientos grados.","C":"Que tengan envase transparente rígido y que incluyan fecha de fabricación en relieve.","D":"Que presenten un bajo coste unitario y que puedan reutilizarse tras un lavado enzimático."},"correcta":"A","explicacion":"El documento destaca que todo el material del carro de curas debe reunir dos cualidades fundamentales respecto al contacto con el paciente: garantizar un uso seguro (estéril cuando proceda y libre de defectos) y no ser irritante."},{"id":143,"temaId":"tema-7","tema":"Tema 7. El carro de curas","subtemaId":"7.2","subtema":"7.2. Limpieza del carro de curas","enunciado":"Un TCAE nuevo pregunta al equipo con qué frecuencia debe realizarse la limpieza completa del carro de curas en una planta hospitalaria y qué tarea organizativa conviene hacer de forma simultánea.","opciones":{"A":"Una vez a la semana durante el turno de noche, aprovechando para revisar solo los antisépticos caducados.","B":"Únicamente cuando se derrame sangre visible en las bandejas, evitando mover las cajas metálicas cerradas.","C":"Cada quince días coincidiendo con la limpieza general del servicio, devolviendo el carro al almacén.","D":"Al menos una vez al día, aprovechando el procedimiento para reponer todo el material que se haya gastado."},"correcta":"D","explicacion":"La limpieza del carro de curas debe realizarse como mínimo una vez al día (y siempre que se ensucie visiblemente), aprovechando este momento para revisar caducidades y reponer todo el material consumido durante las curas."},{"id":144,"temaId":"tema-7","tema":"Tema 7. El carro de curas","subtemaId":"7.2","subtema":"7.2. Limpieza del carro de curas","enunciado":"Al iniciar el protocolo de limpieza y desinfección diaria del carro de curas, ¿qué dos primeras actuaciones secuenciales debe ejecutar el TCAE antes de aplicar el producto limpiador sobre las superficies?","opciones":{"A":"Pulverizar desinfectante sobre las bandejas inferiores y pasar un paño seco por el soporte de ruedas.","B":"Ponerse los guantes para retirar la bolsa de basura lateral y retirar los objetos de la parte superior.","C":"Lavar la caja metálica cerrada bajo el grifo y colocar después el material limpio en el primer estante.","D":"Reponer inmediatamente las gasas nuevas en los cajones y limpiar por último la bandeja superior."},"correcta":"B","explicacion":"El protocolo comienza protegiéndose con guantes para retirar y cerrar la bolsa de residuos del soporte lateral, y retirando todos los objetos y materiales situados en la parte superior (y sucesivos estantes) para poder limpiar las superficies despejadas."},{"id":145,"temaId":"tema-7","tema":"Tema 7. El carro de curas","subtemaId":"7.2","subtema":"7.2. Limpieza del carro de curas","enunciado":"Durante la limpieza de la estructura y las bandejas del carro de curas, ¿en qué dirección espacial debe proceder siempre el TCAE para evitar recontaminar las zonas ya higienizadas?","opciones":{"A":"De atrás hacia delante en círculos concéntricos, empezando por las ruedas giratorias.","B":"De abajo hacia arriba, comenzando por el estante inferior hasta llegar al plano superior.","C":"Siempre de arriba abajo, limpiando primero los estantes superiores antes que los inferiores.","D":"Desde el soporte lateral de residuos hacia el centro de la bandeja inferior indistintamente."},"correcta":"C","explicacion":"Como norma higiénica fundamental en la limpieza del carro de curas, se procede siempre de arriba abajo (y de las zonas más limpias a las más sucias), limpiando primero la bandeja superior y descendiendo hacia los estantes inferiores y ruedas."},{"id":146,"temaId":"tema-7","tema":"Tema 7. El carro de curas","subtemaId":"7.2","subtema":"7.2. Limpieza del carro de curas","enunciado":"Tras aplicar la solución limpiadora y desinfectante sobre todas las bandejas y cajones del carro de curas, ¿qué pauta debe seguir el TCAE respecto al secado de las superficies antes de recolocar el material?","opciones":{"A":"Aclarar siempre con alcohol de noventa y seis grados y secar inmediatamente con algodón hidrófilo.","B":"Colocar el material estéril sobre las bandejas húmedas para mantener un ambiente desinfectado.","C":"Secar enérgicamente con toallas textiles reutilizables de quirófano sin esperar tiempo de contacto.","D":"Seguir siempre las instrucciones específicas del fabricante del producto desinfectante empleado."},"correcta":"D","explicacion":"El secado y el tiempo de actuación tras aplicar el desinfectante deben realizarse siguiendo estrictamente las indicaciones del fabricante del producto utilizado (algunos requieren tiempo de contacto y secado al aire; otros precisan aclarado o secado con paño desechable)."},{"id":147,"temaId":"tema-7","tema":"Tema 7. El carro de curas","subtemaId":"7.3","subtema":"7.3. Técnica de plegado de torundas en crisálida","enunciado":"En la unidad se describe la técnica de plegado de torundas en crisálida realizadas con gasas y guantes estériles. ¿En qué tres situaciones asistenciales indica el texto que se utilizan principalmente estas torundas?","opciones":{"A":"En curas de heridas, limpieza de cavidades como boca o genitales y aseptización antes de inyecciones.","B":"En el taponamiento de grandes hemorragias arteriales, fijación de catéteres y vendaje compresivo.","C":"En la limpieza diaria de los estantes del carro de curas, secado del instrumental y pulido de agujas.","D":"En el aislamiento estéril de campos quirúrgicos abdominales, suturas cutáneas y drenajes pleurales."},"correcta":"A","explicacion":"Las torundas dobladas en crisálida (confeccionadas con gasas estériles y usando guantes estériles) se emplean principalmente para realizar curas de heridas, limpiar cavidades sensibles como la boca o los genitales y aseptizar la piel antes de administrar inyecciones o punciones."},{"id":148,"temaId":"tema-7","tema":"Tema 7. El carro de curas","subtemaId":"7.3","subtema":"7.3. Técnica de plegado de torundas en crisálida","enunciado":"Al iniciar el procedimiento de confección de una torunda en crisálida con una gasa cuadrada desplegada sobre las manos enguantadas estériles, ¿en qué consisten exactamente los pasos segundo y tercero del plegado?","opciones":{"A":"Enrollar la gasa desde una esquina hasta formar un cilindro alargado y doblarla por su punto medio.","B":"Juntar las cuatro puntas hacia el centro formando un cuadrado pequeño y sujetarlo con pinzas de Pean.","C":"Doblarla en diagonal formando un triángulo y hacer dos dobleces de unos dos centímetros en la base.","D":"Dividir la gasa por la mitad en rectángulo y realizar tres pliegues en acordeón de cinco centímetros."},"correcta":"C","explicacion":"Tras ponerse guantes estériles y desplegar la gasa (paso 1), se dobla la gasa en diagonal por la mitad formando un triángulo (paso 2) y a continuación se realizan dos dobleces paralelos de aproximadamente dos centímetros en el borde largo o base del triángulo (paso 3)."},{"id":149,"temaId":"tema-7","tema":"Tema 7. El carro de curas","subtemaId":"7.3","subtema":"7.3. Técnica de plegado de torundas en crisálida","enunciado":"Una vez realizados los dobleces iniciales de la base triangular en el plegado en crisálida, ¿cómo se ejecutan los pasos cuarto a séptimo para dar forma firme y cerrar la torunda sin que queden hilachas sueltas?","opciones":{"A":"Se introduce el pulgar por el vértice superior, se gira la gasa dos veces y se fija con esparadrapo.","B":"Se sujetan ambos picos con unas pinzas de Kocher y se enrolla todo el cuerpo hacia el borde inferior.","C":"Se atan las dos puntas laterales con un nudo simple y se dejan los bordes deshilachados hacia fuera.","D":"Se coloca el dedo índice debajo, se enrolla haciendo nudo, se enrollan los picos y se introduce uno en el hueco."},"correcta":"D","explicacion":"En los pasos 4 a 7 de la técnica en crisálida, se coloca el dedo índice debajo de la gasa, se enrolla alrededor formando un nudo suave, se enrollan los picos laterales sobrantes hacia el centro y se introduce uno de ellos en el hueco que deja el dedo al retirarlo, asegurando que todas las esquinas queden ocultas."},{"id":150,"temaId":"tema-7","tema":"Tema 7. El carro de curas","subtemaId":"7.3","subtema":"7.3. Técnica de plegado de torundas en crisálida","enunciado":"Tras finalizar la confección y almacenamiento o uso de las torundas estériles en crisálida, ¿qué acciones obligatorias corresponden a los dos últimos pasos del protocolo?","opciones":{"A":"Guardar los guantes usados en el cajón superior del carro y rociar las torundas con suero fisiológico.","B":"Quitarse los guantes, realizar el lavado de manos y registrar debidamente la
